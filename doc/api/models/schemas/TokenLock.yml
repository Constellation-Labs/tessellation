type: object
description: A token lock transaction
required:
  - source
  - amount
  - fee
  - parent
properties:
  source:
    $ref: './Address.yml'
    description: The source wallet address
  amount:
    type: integer
    format: int64
  fee:
    type: integer
    format: int64
  parent:
    $ref: './TokenLockReference.yml'
    description: Reference to the parent token lock transaction
  currencyId:
    type: string
    description: Optional currency identifier for the token lock. NULL for DAG. 
    nullable: true
  unlockEpoch:
    type: integer
    format: int64
    minimum: 0
    description: Optional epoch progress value when the tokens will be unlocked. NULL for indefinite lock. 
    nullable: true
  replaceTokenLockRef:
    type: './Hash.yml'
    description: Reference hash of an existing token lock to increase. When provided, this field allows increasing the amount of an existing token lock by replacing it instead of creating a new one.
    nullable: true
