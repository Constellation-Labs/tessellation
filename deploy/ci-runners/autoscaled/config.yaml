---
# github-hetzner-runners — autoscaler config for the tessellation E2E CI fleet.
#
# One ephemeral Hetzner Cloud server per queued E2E job; the server powers itself
# off when the job finishes and the autoscaler deletes it. Replaces the
# GitHub-hosted `Ubuntu-22-64-core` larger runner (~$0.162/min, ~$2k/mo).
#
# Why one server per job (and not several runners per big box): the E2E harness is
# NOT multi-tenant. compose-runner.sh creates a fixed-name docker network
# `tessellation_common` on a fixed subnet (NET_PREFIX, default 172.32.0.0/24) with
# fixed container names (gl0-0, gl1-0, ...) and fixed host ports (9000-9412). Two
# concurrent jobs on one host collide on all four. A server per job sidesteps that
# entirely — no docker-in-docker, no harness changes.
#
# Tokens are injected from the environment by systemd (see systemd/ and
# bootstrap-controller.sh); nothing secret is committed here.
#
# Full option reference:
#   https://github.com/testflows/TestFlows-GitHub-Hetzner-Runners/wiki/Program-Options
config:
  github_token: ${GITHUB_TOKEN}
  github_repository: ${GITHUB_REPOSITORY}
  hetzner_token: ${HETZNER_TOKEN}

  # Public key installed on every runner so an operator can SSH in to debug a
  # wedged job before the server is reaped.
  ssh_key: "/etc/github-hetzner-runners/runner_key.pub"

  # ---------------------------------------------------------------------------
  # Job -> server mapping
  # ---------------------------------------------------------------------------
  # Only act on jobs carrying this label. Deliberately NOT the default
  # `self-hosted`: gating on our own label means an unrelated `self-hosted` job
  # can never silently spend money in this project.
  # ONE label only. This is an AND, not an OR: job_matches_labels()
  # (scale_up.py:569) requires EVERY entry here to be present on the job, and
  # filtered_run_jobs() silently skips any job that misses one. Listing both
  # tessellation-e2e and tessellation-e2e-large meant a job had to carry both at
  # once -- which nothing does -- so no job ever matched and the fleet created no
  # runners at all, with no error logged anywhere. Verified the hard way
  # 2026-09-16: a queued smoke job sat for 5+ minutes against an otherwise
  # healthy controller.
  #
  # Consequence: tessellation-e2e-large jobs are NOT served while this says
  # tessellation-e2e. That is fine today -- cpx62 is already the largest shared
  # instance, so the meta_label below resolves to the same box, and the only
  # workflow entry that used it (fork-recovery) is commented out. To serve both,
  # the wide workflow must request BOTH labels in runs-on, e.g.
  # `runs-on: [tessellation-e2e, tessellation-e2e-large]`.
  with_label:
    - "tessellation-e2e"

  # `tessellation-e2e` in a workflow's `runs-on` expands to the labels below,
  # which is how the server type / image / location get chosen. Keeping this
  # indirection in the autoscaler (not the workflow) means resizing the fleet is
  # a controller-side config change + service restart — no repo PR, no rerun of
  # in-flight PRs.
  #
  #   type-*  server type          image-* OS image        in-*  location
  meta_label:
    tessellation-e2e:
      - "self-hosted"
      - "type-cpx62"
      - "image-x86-app-docker-ce"
      - "in-hel1"
    # For test groups that run a wider topology than the 3-gl0 default — today
    # only fork-recovery (--num-gl0=5, i.e. ~17 JVM containers instead of 13).
    # Currently unused: the fork-recovery matrix entry is commented out in
    # e2e-just-test.yml pending PR #1485. Kept defined so re-enabling it is a
    # one-line workflow change.
    # NOTE: cpx62 is already the LARGEST shared instance Hetzner sells in hel1
    # (16c/32 GB); there is no shared step up from it. So "large" is currently
    # the same box as the normal label. A genuinely wider topology needs the
    # dedicated-core quota raised and a ccx53 — see the sizing note below.
    tessellation-e2e-large:
      - "self-hosted"
      - "type-cpx62"
      - "image-x86-app-docker-ce"
      - "in-hel1"

  # SIZING — THE dominant cost variable, not a detail. Per-job need is ~13 JVM
  # containers (3 gl0 + 3 gl1 + 1 ml0 + 3 cl1 + 3 dl1), each defaulting to
  # `-Xmx8g` with `-XX:ActiveProcessorCount=8` (docker/entrypoint.sh,
  # docker-compose.test.yaml).
  #
  # Prices below are hel1, pulled from the Hetzner API for this account (net ==
  # gross). Monthly totals assume ~660 job-servers/mo (11 E2E jobs x ~60 runs) at
  # ~1.22 billed hours each — Hetzner rounds every partial hour UP to a full
  # calendar hour, so a 4-18 min job usually costs 1-2 h. Add the EUR 22.99/mo
  # controller.
  #
  #   ccx33  8c /  32 GB  EUR 0.2612/h  ~= EUR 195/mo total  (89%) — REJECTED, see below
  #   ccx43 16c /  64 GB  EUR 0.5216/h  ~= EUR 353/mo total  (81%) — default
  #   ccx53 32c / 128 GB  EUR 1.0088/h  ~= EUR 683/mo total  (63%) — more CPU margin
  #
  # Baseline being replaced: GitHub `Ubuntu-22-64-core` at $0.162/min ~= $2000/mo.
  #
  # MEASURED on the fork 2026-07-31..08-03 (all 11 jobs green on one runner):
  # 15 containers, peak 26.7 GB RAM, peak load 15.42, ~70 min for the 9-group
  # matrix, longest single job 18m29s (allow-spends).
  #
  # ccx33 is REJECTED on evidence: it passed once, then on repeat runs (a) the
  # kernel OOM-killed the Actions runner agent during allow-spends — p90 memory
  # 99%, peak 100% of 32 GB, no swap — and (b) load hit 15.42/8 cores (193%),
  # starving GL0's snapshot route into HTTP 503 and failing `spend`. ccx43 puts
  # those peaks at ~42% memory / ~96% load, with only 0.7% of samples above 16.
  #
  # Memory is the binding constraint, not CPU. The fixed variant provisions a 16 GB
  # swap backstop so an overshoot degrades to paging instead of killing the runner
  # process; bake the equivalent into any snapshot image used here.
  #
  # WHY cpx62 (SHARED vCPU) — reversed 2026-09-16, deliberately.
  #
  # This file used to default to ccx43 and told you never to use CPX, citing
  # docker-compose.test.yaml on shared-CPU contention. That citation does not
  # support the claim: the comment there is about OUR OWN 15 sibling JVMs each
  # sizing their FJP/GC pools to the full host CPU count — an in-guest effect,
  # already capped by -XX:ActiveProcessorCount=8, and identical on dedicated
  # cores. It says nothing about hypervisor steal. Measured steal on the four
  # CPX boxes in this account: 0.000% since boot, over 20-25 weeks.
  #
  # Two facts decide it:
  #
  #  1. CCX IS NOT ORDERABLE. This account's dedicated-core limit is 8 and
  #     ci-runner-1 (ccx33) consumes all of it. A real POST /servers for ccx33
  #     AND for ccx13 (2 cores) both return HTTP 403 resource_limit_exceeded,
  #     "dedicated core limit exceeded". Until Hetzner support raises that,
  #     every ccx* value in this file is unbuyable at any budget.
  #
  #  2. cpx62 STRICTLY DOMINATES the runner we use today. ci-runner-1 is a
  #     ccx33: 8 cores / 32 GB. cpx62 is 16 cores / 32 GB. Same RAM, double the
  #     cores. The measured ccx33 CPU failure was load 15.42 on 8 cores (193%),
  #     which starved GL0's /global-snapshots/latest/combined into HTTP 503 and
  #     failed `spend`; the same load on 16 cores is 96%, where ccx43 measured
  #     fine. So this is an upgrade over current CI, not a downgrade.
  #
  # WHAT IT DOES NOT FIX: memory. 32 GB is the binding constraint and cpx62 does
  # not move it — the shared line simply stops there (cpx62 and cax41 are both
  # 32 GB, and cax41 is ARM, which our x86 node images rule out). Peak was
  # 29.7 GB of 31.3 GB. scripts/setup.sh therefore provisions a 16 GB swap
  # backstop on every server, which converts an OOM kill into a slow job. Expect
  # the heaviest 15-container groups to be tight until per-group peak RSS is
  # measured (only dag-cluster is, at 5.8 GB) and the heavy ones are either
  # heap-tuned or pinned to a dedicated box.
  #
  # Cost at cpx62, same ~540 job-servers/mo x ~1.22 billed hours:
  #   cpx62  16c / 32 GB  EUR 0.2452/h  ~= EUR 220/mo incl. controller  (88%)
  #   ccx43  16c / 64 GB  EUR 0.5216/h  ~= EUR 443/mo incl. controller  (76%)
  # against the ~EUR 1852/mo GitHub Ubuntu-22-64-core baseline.
  default_server_type: cpx62
  default_image: "x86:app:docker-ce"

  # Custom server scripts. This REPLACES the package's scripts directory wholesale
  # — get_setup_script()/get_startup_script() in scale_up.py raise if a file is
  # missing rather than falling back — so bootstrap-controller.sh copies the
  # installed package's scripts dir here first and then overlays our setup.sh.
  # That way startup-x64.sh always tracks the installed package version and the
  # only file we maintain is the one we actually changed.
  scripts: "/etc/github-hetzner-runners/scripts"
  default_location: hel1

  # ---------------------------------------------------------------------------
  # Concurrency
  # ---------------------------------------------------------------------------
  # The E2E matrix is ELEVEN jobs on this label -- dag-cluster, delegated-staking,
  # token-lock-replacement, currency, rewards, token-locks, allow-spends, spend,
  # data-with-fee, snapshot-streaming, committee-rewards. (Earlier revisions of
  # this file said 9 and claimed snapshot-streaming stays GitHub-hosted; it has no
  # `runner:` override, so it lands here like the rest, and committee-rewards was
  # added since.)
  #
  # 8 is deliberately BELOW the count needed for a single wave, and it is sized to
  # the SHARED project this fleet runs in -- there is only one Hetzner project
  # here, holding the nightly boxes, ci-runner-1, ci-builder-1 and roman-ai.
  #
  # That co-tenancy is safe. The autoscaler can only see its own servers: both
  # servers.get_all() calls in the package pass
  # label_selector="github-hetzner-runner=active" (scale_down.py:414,
  # scale_up.py:1502), and the single server.delete() call site
  # (scale_down.py:113) is fed from that list. GitHub-side it only touches
  # runners whose name starts with "github-hetzner-runner-", so ci-runner-1 is
  # never deregistered.
  #
  # Capacity VERIFIED 2026-09-16 rather than assumed: 9 cpx62 were created
  # simultaneously on top of the 7 existing servers -- 16 servers and 220 shared
  # cores -- with no refusal, then deleted. Peak here is 7 existing + 8 runners
  # (128 cores) + 1 cpx22 controller (2 cores) = 16 servers / 206 cores, inside
  # that. No support ticket needed. Note the headroom is thin: adding another
  # permanent server to this project eats into it, so re-probe before raising
  # max_runners.
  #
  # The wall-clock cost of stopping at 8 is small, because the makespan is floored
  # by the LONGEST SINGLE JOB, not by the job count: measured jobs run 3m41s to
  # 18m29s against 30/45 min timeouts, so ~105 min of total work across 11 jobs.
  # 11 runners finish in ~20 min (one wave, bounded by the longest job); 8 runners
  # finish in ~22-27 min, since the 3 queued jobs start as soon as the quickest of
  # the first 8 frees a slot. Going 1 -> 8 captures nearly all of the ~105 min ->
  # ~25 min win; 8 -> 12 buys the last ~5 min and costs a support ticket.
  #
  # Cost is UNCHANGED by this number. Billing is per job-server-hour, and the same
  # 11 jobs run either way -- max_runners caps concurrency, not spend. A job that
  # waits in the queue has no server and bills nothing.
  #
  # Raise to 12 (and request a project limit of >= 30) if the extra ~5 min of PR
  # feedback is worth it. See README.
  max_runners: 8

  # Let one PR use the whole fleet. With 11 jobs against 8 runners any single PR
  # already saturates it, so a lower cap here would only split that PR's own
  # matrix into more waves without helping a second PR meaningfully. Drop this to
  # ~6 if PR-vs-PR fairness matters more than one PR finishing fast.
  max_runners_in_workflow_run: 8

  # ---------------------------------------------------------------------------
  # Lifecycle
  # ---------------------------------------------------------------------------
  # Recycling reuses powered-off servers instead of creating fresh ones. Off by
  # choice: Hetzner bills a server for existing, not for running, so pooled
  # powered-off servers cost real money; and a guaranteed-fresh box per job is
  # precisely the isolation we are buying. Our jobs run ~20-45 min, so a ~60 s
  # boot is noise. Turn on only if boot latency ever becomes the bottleneck.
  recycle: false

  # Reap anything that powers off (job finished, or `sudo poweroff` from the
  # startup script) quickly, so we stop paying for it.
  max_powered_off_time: 60

  # A runner that registers but never picks up a job is a leak — kill it.
  max_unused_runner_time: 180

  # Generous vs the 120 s defaults: these servers boot the Docker CE app image and
  # then download the actions runner, which can exceed two minutes on a cold
  # Hetzner image. Too-tight values here show up as phantom scale-up failures.
  max_runner_registration_time: 300
  max_server_ready_time: 300

  # Poll cadence for queued/finished jobs. 30 s (vs the 60 s default) roughly
  # halves the queue-to-boot latency for the cost of ~2x GitHub API calls, which
  # the tool's HTTP caching absorbs.
  scale_up_interval: 30
  scale_down_interval: 30

  workers: 10
  delete_random: false
  debug: false

  # ---------------------------------------------------------------------------
  # Monitoring — bound to loopback; reach it over an SSH tunnel:
  #   ssh -L 8090:127.0.0.1:8090 -L 9099:127.0.0.1:9099 admin@<controller-ip>
  # ---------------------------------------------------------------------------
  dashboard_host: "127.0.0.1"
  dashboard_port: 8090
  metrics_host: "127.0.0.1"
  # 9099, not the tool's 9090 default: 9090 is Prometheus on the tessellation
  # monitoring hosts and reusing it invites confusion across runbooks.
  metrics_port: 9099

  logger_config:
    version: 1
    disable_existing_loggers: false
    formatters:
      stdout:
        class: testflows.github.hetzner.runners.logger.StdoutFormatter
        format: "%(asctime)s %(message)s"
        datefmt: "%H:%M:%S"
      rotating_file:
        class: testflows.github.hetzner.runners.logger.RotatingFileFormatter
        format: "%(asctime)s,%(interval)s,%(levelname)s,%(run_id)s,%(job_id)s,%(server_name)s,%(threadName)s,%(funcName)s,%(message)s"
        datefmt: "%Y-%m-%d,%H:%M:%S"
    handlers:
      stdout:
        level: INFO
        formatter: stdout
        class: testflows.github.hetzner.runners.logger.StdoutHandler
        stream: "ext://sys.stdout"
      rotating_logfile:
        level: DEBUG
        formatter: rotating_file
        class: testflows.github.hetzner.runners.logger.RotatingFileHandler
        filename: /var/log/github-hetzner-runners/service.log
        maxBytes: 10485760
        backupCount: 5
    loggers:
      testflows.github.hetzner.runners:
        level: INFO
        handlers:
          - stdout
          - rotating_logfile
