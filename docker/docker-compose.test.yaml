services:
  gl0:
    # NET_ADMIN required for tc-based network isolation in fork recovery tests
    cap_add:
      - NET_ADMIN
    environment:
      # Consensus timing overrides — HOCON ${?VAR} in conf files reads these.
      # Defaults baked in so local `just test` runs don't require shell exports;
      # CI / shell can still override by setting the var explicitly.
      # HOCON ${?VAR} fails to parse empty strings — never pass empty values.
      - CL_DECLARATION_TIMEOUT=${CL_DECLARATION_TIMEOUT:-90 seconds}
      - CL_RE_STALL_TIMEOUT=${CL_RE_STALL_TIMEOUT:-40 seconds}
      # Bare-form pass-through: only forwarded when explicitly set in shell.
      - CL_TIME_TRIGGER_INTERVAL
      - CL_MAX_ROUND_DURATION
      - CL_EVENT_TRIGGER_COOLDOWN
      # Chronic-non-signer thresholds — TEST DEVIATION from production defaults.
      #
      # Production defaults are 10 observations / 0.50 ratio. These are tuned for
      # long-running clusters where peers accumulate thousands of `participated`
      # events before any outage, plus the qualityDecayThreshold=100 sliding
      # window keeps the ratio meaningful over time.
      #
      # E2E tests run in ~20-30 minutes total. Phase 1 stabilization gives the
      # isolation target only ~15-20 rounds of pre-outage credit. A 270s
      # isolation = ~14 absent rounds, which against ~10 prior credits puts the
      # ratio at ~0.42 — false-positive chronic classification driven by the
      # test's accelerated timeline, not by actual chronic behavior.
      #
      # Override is more permissive (0.30 ratio, 20 observations minimum) so
      # the test exercises fork-recovery without tripping a classification that
      # in production would never fire for this access pattern.
      #
      # Architectural follow-up (v8): add a "minimum recent history" prerequisite
      # so chronic classification can't fire before a peer has had at least one
      # decay-window of opportunity. That eliminates the test-vs-production
      # threshold split entirely.
      - CL_MIN_PARTICIPATION_OBSERVATIONS=${CL_MIN_PARTICIPATION_OBSERVATIONS:-20}
      - CL_MIN_PARTICIPATION_RATIO=${CL_MIN_PARTICIPATION_RATIO:-0.30}
    # merge in an extra network just for tests
    networks:
      tessellation_common:
        aliases:
          - gl0${CONTAINER_NAME_SUFFIX:-}
        ipv4_address: ${NET_PREFIX}.1${CONTAINER_OFFSET:-0}
  gl1:
    # merge in an extra network just for tests
    networks:
      tessellation_common:
        aliases:
          - gl1${CONTAINER_NAME_SUFFIX:-}
        ipv4_address: ${NET_PREFIX}.2${CONTAINER_OFFSET:-0}
# declare the external network (must already exist)
networks:
  tessellation_common:
    external: true
