services:
  gl0:
    # NET_ADMIN required for tc-based network isolation in fork recovery tests
    cap_add:
      - NET_ADMIN
    environment:
      # Consensus timing overrides — HOCON ${?VAR} in conf files reads these.
      # Defaults baked in so local `just test` runs don't require shell exports;
      # CI / shell can still override by setting the var explicitly.
      # HOCON ${?VAR} fails to parse empty strings — never pass empty values.
      - CL_DECLARATION_TIMEOUT=${CL_DECLARATION_TIMEOUT:-90 seconds}
      - CL_RE_STALL_TIMEOUT=${CL_RE_STALL_TIMEOUT:-40 seconds}
      # Bare-form pass-through: only forwarded when explicitly set in shell.
      - CL_TIME_TRIGGER_INTERVAL
      - CL_MAX_ROUND_DURATION
      - CL_EVENT_TRIGGER_COOLDOWN
      # Chronic-non-signer thresholds: production defaults are now safe in tests.
      #
      # Pre-v8 (2026-04-29) the E2E test had to override these (20 obs / 0.30 ratio)
      # because a 270s isolation accumulated ~14 absent rounds against only ~15-20
      # rounds of pre-outage credit, putting the ratio at ~0.42 — false-positive
      # chronic classification driven by the test's accelerated timeline rather than
      # actual chronic behavior.
      #
      # v8 added `minObservationHistoryFloor=30`. The chronic predicate now also
      # requires `participated >= 30` before classification can fire, so test peers
      # (which see ~30 rounds total) can no longer cross the floor inside the test
      # window. Production defaults exercise fork-recovery cleanly. Operators can
      # still override via CL_MIN_OBSERVATION_HISTORY_FLOOR for targeted experiments.
    # merge in an extra network just for tests
    networks:
      tessellation_common:
        aliases:
          - gl0${CONTAINER_NAME_SUFFIX:-}
        ipv4_address: ${NET_PREFIX}.1${CONTAINER_OFFSET:-0}
  gl1:
    # merge in an extra network just for tests
    networks:
      tessellation_common:
        aliases:
          - gl1${CONTAINER_NAME_SUFFIX:-}
        ipv4_address: ${NET_PREFIX}.2${CONTAINER_OFFSET:-0}
# declare the external network (must already exist)
networks:
  tessellation_common:
    external: true
