state-after-joining = WaitingForDownload

trust {
  daemon {
    interval = 10 minutes
  }
}

snapshot {
  consensus {
    time-trigger-interval = 43 seconds
    time-trigger-interval = ${?CL_TIME_TRIGGER_INTERVAL}
    declaration-timeout = 45 seconds
    declaration-timeout = ${?CL_DECLARATION_TIMEOUT}
    declaration-range-limit = 3
    lock-duration = 10 seconds
    re-stall-timeout = 15 seconds
    re-stall-timeout = ${?CL_RE_STALL_TIMEOUT}
    max-stall-cycles = 3
    max-round-duration = 5 minutes
    max-round-duration = ${?CL_MAX_ROUND_DURATION}
    removal-penalty-rounds = 5
    removal-penalty-rounds = ${?CL_REMOVAL_PENALTY_ROUNDS}
    exponential-penalty-base = 2
    exponential-penalty-base = ${?CL_EXPONENTIAL_PENALTY_BASE}
    max-removal-penalty-rounds = 100
    max-removal-penalty-rounds = ${?CL_MAX_REMOVAL_PENALTY_ROUNDS}
    candidate-deferral-rounds = 3
    candidate-deferral-rounds = ${?CL_CANDIDATE_DEFERRAL_ROUNDS}

    event-cutter {
      max-binary-size-bytes = 20971520
      max-update-node-parameters-size = 100
    }

    event-trigger-threshold = 1
    event-trigger-cooldown = 5s
    event-trigger-cooldown = ${?CL_EVENT_TRIGGER_COOLDOWN}
    fork-lag-threshold = 10
    fork-lag-threshold = ${?CL_FORK_LAG_THRESHOLD}
    # v15 (2026-05-08): lowered 0.67 → 0.6 to recover the testnet cluster wedged at ord 3121872.
    # Committee=5 with 2 unreliable members (one community peer in SessionStarted, one gone from
    # mesh) couldn't form 4-of-5 quorum. 0.6 gives 3-of-5 (ceil(5*0.6)=3) so the 3 priority nodes
    # can close rounds without waiting on chronic non-responders. This drops below the classic
    # BFT threshold (2/3 = 0.667) and trades safety against Byzantine attack for liveness — fine
    # on the trusted-seedlist threat model, would NOT be appropriate on mainnet.
    quorum-threshold-fraction = 0.6
    quorum-threshold-fraction = ${?CL_QUORUM_THRESHOLD_FRACTION}
    min-participation-observations = 10
    min-participation-observations = ${?CL_MIN_PARTICIPATION_OBSERVATIONS}
    # v15 (2026-05-08): tightened 0.5 → 0.6. Real source-node participation runs ~85% even
    # accounting for restart cycles, so 0.6 keeps healthy nodes comfortably in committees while
    # filtering peers with sustained low signing rates (b79d9817-class disappearances).
    min-participation-ratio = 0.6
    min-participation-ratio = ${?CL_MIN_PARTICIPATION_RATIO}
    # v10 (2026-04-30): lowered 30 → 10 to recover from the post-restart deadlock.
    # The FACILITY_FOREVER cohort had `participated` between minObservations (10)
    # and the old floor (30), so the chronic-non-signer classifier never fired and
    # 5+ silent facilitators stayed in committee, driving QUORUM_INFEASIBLE_EVICTION
    # at every round. Floor=10 lets the classifier kick in within ~10 rounds (~5–7
    # min at testnet cadence) instead of ~30 rounds. Combined with the BFT-correct
    # eviction cap at StallDetector.selectEvictionTargets (committee-minQuorum =
    # f bound), this is the recovery path.
    min-observation-history-floor = 10
    min-observation-history-floor = ${?CL_MIN_OBSERVATION_HISTORY_FLOOR}
    lock-on-vote-protocol-version = 2
    lock-on-vote-protocol-version = ${?CL_LOCK_ON_VOTE_PROTOCOL_VERSION}
  }

  max-facilitator-count {
    mainnet: 1000
    testnet: 1000
    integrationnet: 1000
    dev: 1000
  }

  in-memory-capacity = 10

  snapshot-path = "data/snapshot"
  snapshot-path = ${?CL_SNAPSHOT_STORED_PATH}

  incremental-tmp-snapshot-path = "data/incremental_snapshot_tmp"
  incremental-tmp-snapshot-path = ${?CL_INCREMENTAL_SNAPSHOT_TMP_STORED_PATH}

  incremental-persisted-snapshot-path = "data/incremental_snapshot"
  incremental-persisted-snapshot-path = ${?CL_INCREMENTAL_SNAPSHOT_STORED_PATH}

  snapshot-info-path = "data/snapshot_info"
  snapshot-info-path = ${?CL_SNAPSHOT_INFO_PATH}

  calculated-state-path = "data/calculated_state"
  calculated-state-path = ${?CL_CALCULATED_STATE_PATH}

  global-snapshots-with-state-path= "data/global_snapshots/snapshots_with_state"
  global-snapshots-with-state-path = ${?CL_GLOBAL_SNAPSHOTS_WITH_STATE_PATH}

  global-snapshots-with-state-deltas-path= "data/global_snapshots/snapshots_with_state_deltas"
  global-snapshots-with-state-deltas-path = ${?CL_GLOBAL_SNAPSHOTS_WITH_STATE_DELTAS_PATH}

  max-global-snapshots-with-state-stored = 2
  max-global-snapshots-with-state-deltas-stored = 100

  combined-snapshot-checkpoint-path = "data/combined_snapshot_checkpoint"
  combined-snapshot-checkpoint-path = ${?CL_COMBINED_SNAPSHOT_CHECKPOINT_PATH}
}

state-channel {
  pull-delay = 0
  purge-delay = 5
}

peer-discovery {
  delay {
    check-peers-attempt-delay = 1 minute
    check-peers-max-delay = 10 minutes
    additional-discovery-delay = 0 minutes
    min-peers = 1
  }
}

incremental {
  last-full-global-snapshot-ordinal {
    mainnet: 766717
    testnet: 736766
    integrationnet: 0
    dev: 0
  }
}

# Per-IP rate limit on public /global-snapshots/* routes. Guards against
# community peer clients polling tight-loop from the same source IP.
# Overrides the defaults in application.conf.
#
# Per-IP caps on the PUBLIC snapshot routes (port 9000). Some validator-to-validator traffic
# (chain-tip sampling, ordinal-hash agreement) ALSO transits the public port, so caps here
# are not strictly an "anonymous-clients-only" throttle. Use the per-ip-allowlist (env var
# CL_SNAPSHOT_PER_IP_ALLOWLIST) to exempt operator-controlled validator IPs from the cap.
#
# v10 (2026-04-30): tightened from 30 → 10 req/min and 300 → 100 MB/min for egress
# containment after observing third-party pollers driving the bulk of public:9000 egress.
#
# v14 (2026-05-02): raised request cap from 10 → 120 req/min (= 2/sec sustained) following
# observation that 10/min was suffocating legitimate intra-cluster gossip when validator IPs
# were not allowlisted. With a 14-peer cluster, each peer issues chain-tip + ordinal + hash
# probes against the public port at a cadence that easily breaks 10/min, and a missed tip
# probe degrades the leader's facility quorum on the next round. 120/min preserves the
# anti-abuse property (a single non-allowlisted IP still cannot exceed 2 req/sec) while
# giving honest peers ~10× headroom over the steady-state poll rate. The bandwidth cap
# (100 MB/min) is retained as the hard egress ceiling — that's what actually bounds the
# bulk-poller threat, not the request count.
snapshot-serving {
  per-ip-max-requests-per-window = 120
  per-ip-max-requests-per-window = ${?CL_SNAPSHOT_PER_IP_MAX_REQUESTS_PER_WINDOW}
  # v10 (2026-04-30) per-IP bandwidth cap. Applies only to heavyweight snapshot routes
  # (latest/combined/stream + per-ordinal checkpoint stream). 100 MB / 1 minute ≈
  # 1.6 MiB/s sustained per IP — fits one ~60-72 MB combined snapshot per minute, a fair
  # ration for a cooperative anonymous client and an obvious throttle on bulk re-pollers.
  # Set to 0 to disable the bandwidth limiter entirely.
  per-ip-max-bytes-per-window = 104857600
  per-ip-max-bytes-per-window = ${?CL_SNAPSHOT_PER_IP_MAX_BYTES_PER_WINDOW}
}
