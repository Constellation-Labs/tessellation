state-after-joining = WaitingForDownload

trust {
  daemon {
    interval = 10 minutes
  }
}

snapshot {
  consensus {
    time-trigger-interval = 43 seconds
    time-trigger-interval = ${?CL_TIME_TRIGGER_INTERVAL}
    declaration-timeout = 45 seconds
    declaration-timeout = ${?CL_DECLARATION_TIMEOUT}
    declaration-range-limit = 3
    lock-duration = 10 seconds
    re-stall-timeout = 15 seconds
    re-stall-timeout = ${?CL_RE_STALL_TIMEOUT}
    max-stall-cycles = 3
    max-round-duration = 5 minutes
    max-round-duration = ${?CL_MAX_ROUND_DURATION}
    removal-penalty-rounds = 5
    removal-penalty-rounds = ${?CL_REMOVAL_PENALTY_ROUNDS}
    exponential-penalty-base = 2
    exponential-penalty-base = ${?CL_EXPONENTIAL_PENALTY_BASE}
    max-removal-penalty-rounds = 100
    max-removal-penalty-rounds = ${?CL_MAX_REMOVAL_PENALTY_ROUNDS}
    candidate-deferral-rounds = 3
    candidate-deferral-rounds = ${?CL_CANDIDATE_DEFERRAL_ROUNDS}
    signature-grace-period = 3 seconds
    signature-grace-period = ${?CL_SIGNATURE_GRACE_PERIOD}
    # SHORT grace used when Core is fully signed but the committee is not, to let late Tier 1
    # signatures land in the proofs and participation evidence without blocking liveness. Delegated
    # rewards follow frozen committee membership, not proofs. Distinct from signature-grace-period
    # (the Core-incomplete window). See ConsensusConfig.tier1SignatureGracePeriod.
    # Timing-only, NOT in deterministicConfigHash. Kebab key matches the pureconfig field mapping
    # of `tier1SignatureGracePeriod` (digit becomes its own token -> `tier-1-...`).
    tier-1-signature-grace-period = 750 milliseconds
    tier-1-signature-grace-period = ${?CL_TIER_1_SIGNATURE_GRACE_PERIOD}

    event-cutter {
      max-binary-size-bytes = 20971520
      max-update-node-parameters-size = 100
    }

    event-trigger-threshold = 1
    event-trigger-cooldown = 5s
    event-trigger-cooldown = ${?CL_EVENT_TRIGGER_COOLDOWN}
    fork-lag-threshold = 10
    fork-lag-threshold = ${?CL_FORK_LAG_THRESHOLD}
    # Reverted prior tightenings back to the alpha.52 baseline. The
    # combined effect of the earlier tightenings (0.67 -> 0.6 quorum, 0.5 -> 0.6 ratio,
    # then 0.6 -> 0.7 ratio, 10 -> 30 floor) was a death spiral: stricter ratios shrank
    # eligible to the point where even source nodes (e2f4496e:21/31 = 0.677) crossed
    # below the 0.7 line and got excluded by their own classifier. The supposed alpha.55
    # wedge fix made things worse; the cluster ran stably for 5 days on the alpha.52
    # values (0.67/0.5/10). The wider witness pool + peersAtHigherKey gate provide the
    # BFT-safety and liveness reinforcements that the tightenings were targeting, without
    # compressing eligible.
    # Adjusted 0.67 -> 0.6666666666666666 (max-precision Double approximation of
    # 2/3 exact). The decimal 0.67 rounded up unfavorably for N divisible by 3: for N=6,
    # ceil(6 * 0.67) = ceil(4.02) = 5 instead of the BFT-intended ceil(2N/3) = 4. This
    # off-by-one caused the wedges where 4-of-6 responsive facilitators
    # failed quorum (4 < 5) and the ViewChangeCertificate escape hatch also wedged
    # because VCC uses the same threshold. BFT safety preserved for f=1: any two
    # quorums of size 4 over N=6 intersect in at least 2*4 - 6 = 2 replicas. Tradeoff:
    # implicit f=2 tolerance (q=5 of N=6) reduced to f=1 (q=4 of N=6); observed silent
    # peers are crash-faulty (network/JVM hang), not byzantine, so the f=1 bound is
    # adequate. Coordinated cold restart required because this value is in
    # deterministicConfigHash (and consensusSchemaVersion is bumped as a fence).
    quorum-threshold-fraction = 0.6666666666666666
    quorum-threshold-fraction = ${?CL_QUORUM_THRESHOLD_FRACTION}
    min-participation-observations = 10
    min-participation-observations = ${?CL_MIN_PARTICIPATION_OBSERVATIONS}
    # Defensive force-VCV threshold. After N consecutive same-key
    # abandonments StallDetector forces a VCV emission regardless of the per-round
    # "missing-still-responsive" gate. Default 3 fires after ~170s (3 * ~57s/abandon
    # cycle) and gives the new view ~115s of cushion before the recovery threshold
    # (maxConsecutiveAbandonments=5 * ~57s = ~285s) would have fired. Strictly less
    # than maxConsecutiveAbandonments so the new view has time to converge before
    # the recovery escalation point. Consensus-critical: in deterministicConfigHash.
    force-view-change-abandonments = 3
    force-view-change-abandonments = ${?CL_FORCE_VIEW_CHANGE_ABANDONMENTS}
    # Active-set parameters. `tightening-window` maintains the signed recentSigners
    # history used by tier hysteresis and active admission. `min-participation-in-window`
    # is retained only for schema/hash compatibility with the retired M-of-K filter.
    # `active-facilitator-floor` is the active-admission emergency bypass threshold and is also
    # read by rollback / ready-participation gates. It is deliberately below normal Core size.
    # These values are consensus-critical: divergent operator values silently fork the cluster.
    tightening-window = 10
    tightening-window = ${?CL_TIGHTENING_WINDOW}
    min-participation-in-window = 6
    min-participation-in-window = ${?CL_MIN_PARTICIPATION_IN_WINDOW}
    active-facilitator-floor = 3
    active-facilitator-floor = ${?CL_ACTIVE_FACILITATOR_FLOOR}
    # active-facilitator-target / active-facilitator-max moved to per-environment maps at the
    # snapshot level (see the blocks after core-committee-size): base scalars sized for testnet
    # (7/13) shipped unchanged to networks with Core floors of 9 and 15, closing the admission
    # feeder below the floor. The CL_ env overrides are gone on purpose -- these values mutate
    # committee derivation, so divergent per-operator values silently forked the cluster.
    # Integral peer controller. Scores are advanced only on finalized rounds and
    # classify Core/leader eligibility. They do not cap the broad Core + Tier-1
    # signing/reward committee. Certified open admission remains bounded separately.
    active-admission-promote-threshold = 100
    active-admission-promote-threshold = ${?CL_ACTIVE_ADMISSION_PROMOTE_THRESHOLD}
    active-admission-retain-threshold = 70
    active-admission-retain-threshold = ${?CL_ACTIVE_ADMISSION_RETAIN_THRESHOLD}
    active-admission-demote-threshold = 40
    active-admission-demote-threshold = ${?CL_ACTIVE_ADMISSION_DEMOTE_THRESHOLD}
    active-admission-max-score = 150
    active-admission-max-score = ${?CL_ACTIVE_ADMISSION_MAX_SCORE}
    active-admission-signature-reward = 20
    active-admission-signature-reward = ${?CL_ACTIVE_ADMISSION_SIGNATURE_REWARD}
    active-admission-responder-reward = 5
    active-admission-responder-reward = ${?CL_ACTIVE_ADMISSION_RESPONDER_REWARD}
    active-admission-missed-active-penalty = 15
    active-admission-missed-active-penalty = ${?CL_ACTIVE_ADMISSION_MISSED_ACTIVE_PENALTY}
    active-admission-timeout-missing-penalty = 10
    active-admission-timeout-missing-penalty = ${?CL_ACTIVE_ADMISSION_TIMEOUT_MISSING_PENALTY}
    active-admission-evicted-penalty = 40
    active-admission-evicted-penalty = ${?CL_ACTIVE_ADMISSION_EVICTED_PENALTY}
    active-admission-degraded-penalty = 5
    active-admission-degraded-penalty = ${?CL_ACTIVE_ADMISSION_DEGRADED_PENALTY}
    active-admission-critical-penalty = 20
    active-admission-critical-penalty = ${?CL_ACTIVE_ADMISSION_CRITICAL_PENALTY}
    active-admission-passive-decay = 1
    active-admission-passive-decay = ${?CL_ACTIVE_ADMISSION_PASSIVE_DECAY}
    active-admission-max-expansion-per-round = 1
    active-admission-max-expansion-per-round = ${?CL_ACTIVE_ADMISSION_MAX_EXPANSION_PER_ROUND}
    active-admission-expansion-interval-rounds = 5
    active-admission-expansion-interval-rounds = ${?CL_ACTIVE_ADMISSION_EXPANSION_INTERVAL_ROUNDS}
    # Reverted 0.7 -> 0.5. See quorum-threshold-fraction note above.
    min-participation-ratio = 0.5
    min-participation-ratio = ${?CL_MIN_PARTICIPATION_RATIO}
    # Reverted 30 -> 10. See quorum-threshold-fraction note above.
    min-observation-history-floor = 10
    min-observation-history-floor = ${?CL_MIN_OBSERVATION_HISTORY_FLOOR}
    lock-on-vote-protocol-version = 2
    lock-on-vote-protocol-version = ${?CL_LOCK_ON_VOTE_PROTOCOL_VERSION}
  }

  max-facilitator-count {
    mainnet: 1000
    testnet: 1000
    integrationnet: 1000
    dev: 1000
  }

  # v19 multi-committee Core floor per environment. The Core committee gates
  # LIVENESS quorum (quorum threshold = ceil(coreSize * quorumThresholdFraction)).
  # Demotions to Tier 1 outside Core do NOT shrink the quorum denominator without
  # consensus-agreed promotion of replacement peers up to this floor. Values are
  # tuned for observed cluster sizes: testnet ~14 peers -> Core 5, mainnet ~150
  # peers -> Core 15, integrationnet ~10 -> Core 9, dev single-node rigs -> Core 3.
  core-committee-size {
    mainnet: 15
    # v24: restored 2 -> 3 after active-facilitator admission started filtering the wide
    # selected pool down to recent signers before committee derivation. With active=3 but
    # Core floor=2, alpha.123 still produced core=2/tier1=1 rounds; one behind Core member
    # then wedged liveness because 1 active < 2 required. Core=3 keeps the reliable recent
    # signer set in the liveness quorum while the admission filter prevents flaky Ready peers
    # from bloating the active denominator. Core=2 remains a degraded/bootstrap shape only
    # when fewer than three active candidates are available.
    testnet: 3
    integrationnet: 9
    dev: 3
  }

  # V35 certified-outcome activation in this L0's own snapshot-ordinal space.
  # IntegrationNet's coordinated activation is scheduled at 5,890,500. Mainnet and
  # testnet stay absent (disabled). Dev starts at genesis so local/e2e clusters exercise
  # the new path.
  certified-consensus-activation-ordinal {
    integrationnet: 5890500
    dev: 0
  }

  # Core-classification target. UNIFORM RULE: 2c+1 of the environment's
  # core-committee-size (testnet's proven 7 for c=3 IS the rule; the other networks get the same
  # rule applied to their Core size). This is the score/recent-signer controller target, not a
  # signing-committee or reward ceiling. Certified open admission can continue adding Tier-1
  # seats above it. Folded into deterministicConfigHash.
  active-facilitator-target {
    mainnet: 31
    testnet: 7
    integrationnet: 19
    dev: 7
  }

  # Controller-classification cap. UNIFORM RULE: 4c+1 of core-committee-size. Bounds the sticky
  # recent-signer Core candidate pool and probation headroom; it does NOT cap retained Core +
  # Tier-1 signing/reward membership. MUST be >= core-committee-size. Hash-folded.
  active-facilitator-max {
    mainnet: 61
    testnet: 13
    integrationnet: 37
    dev: 13
  }

  # v33 quorum-denominator shrink (QuorumDenominatorShrink): number of view-interval units of
  # wall silence since the parent outcome closed after which the escalating quorum shrink begins
  # at the stuck key. activationViews <= 0 disables the rung; mainnet/integrationnet/dev are
  # explicitly 0 (disabled) for a conservative launch -- the deep stage trades partition safety
  # for liveness and must be opted into per environment. Testnet 10 = ~10 minutes of dead air at
  # the 60s view-interval before the first reduction; the post-restart 3-of-6 wedge (ord 3150197)
  # unwedges at required=3 after ~15 minutes total. TO ENABLE wedge-protection on a network, set
  # its entry to N view-intervals of dead air before the first reduction.
  quorum-shrink-activation-views {
    mainnet: 0
    integrationnet: 0
    dev: 0
    testnet: 10
  }

  # Bounded probation re-entry lane for active-facilitator admission. Minimum number of
  # below-promote-threshold ("rehabilitating") peers retained in the Core controller's non-Core
  # classification per round EVEN
  # WHEN the per-round expansion budget (active-admission-max-expansion-per-round) is exhausted.
  # A peer that signs the latest round keeps priority in this controller lane until it reaches the
  # retain band. Missing the latest round ends this classifier priority, not its signing lease.
  # This prevents one-round classifier churn from blocking the evidence needed to graduate. The lane is decoupled from expansion
  # cadence and excluded from the Core leader/liveness-certificate cohort (routed to nonCorePeers).
  # The controller cap does not evict an otherwise eligible Tier-1 signing lease.
  # Env-resolved at the consensus construction site and folded into deterministicConfigHash.
  active-admission-min-probation-reentry-slots {
    # UNIFORM RULE: one Core cohort per round (= core-committee-size), every environment. This lane
    # gives a score-0 peer a bounded controller-classification path (new peers bootstrap below the
    # promote threshold, closing the promoted-expansion and reserve lanes to them). Certified open
    # admission is the separate authority that adds a new signing lease. The previous per-env split
    # (testnet 8, others 0) meant testnet was not running what shipped to the other networks.
    # Classified non-Core on entry, so the peer does not enter the Core leader/liveness-certificate
    # cohort. Outside bootstrap, an admitted Tier-1 signing lease is still counted in the frozen
    # committee finality floor. Below the full-committee reward gate the legacy payout filter is
    # retained for replay; at/after the gate every frozen Core + Tier-1 seat earns.
    mainnet: 15
    integrationnet: 9
    dev: 3
    testnet: 3
  }

  # Recent-signer pool lookback depth (in ordinals) for active-facilitator admission: how far back a
  # peer may have last signed and still hold a sticky, score-gated controller classification instead
  # of churning through the volatile expansion/reserve fill each round. Decoupled from the compiled-in demotion
  # hysteresis (TierTransitions.DemotionConsecutiveMisses = 3), which independently keeps non-recent
  # signers OUT of quorum-bearing Core. It does not cap retained Tier-1 signing/reward membership. Floored to 3 at the
  # construction site so a low value cannot disable the recent-signer path. UNIFORM RULE: every
  # environment runs the full persisted recentSigners window (= tightening-window, 10) -- the
  # previous per-env split (testnet 10, others 3) meant testnet was not running what shipped to
  # the other networks. Folded into
  # deterministicConfigHash, so divergent operator values handshake-reject.
  active-admission-recent-signer-window {
    mainnet: 10
    integrationnet: 10
    dev: 10
    dev: ${?CL_ACTIVE_ADMISSION_RECENT_SIGNER_WINDOW}
    testnet: 10
    testnet: ${?CL_ACTIVE_ADMISSION_RECENT_SIGNER_WINDOW}
  }


  in-memory-capacity = 10

  snapshot-path = "data/snapshot"
  snapshot-path = ${?CL_SNAPSHOT_STORED_PATH}

  incremental-tmp-snapshot-path = "data/incremental_snapshot_tmp"
  incremental-tmp-snapshot-path = ${?CL_INCREMENTAL_SNAPSHOT_TMP_STORED_PATH}

  incremental-persisted-snapshot-path = "data/incremental_snapshot"
  incremental-persisted-snapshot-path = ${?CL_INCREMENTAL_SNAPSHOT_STORED_PATH}

  snapshot-info-path = "data/snapshot_info"
  snapshot-info-path = ${?CL_SNAPSHOT_INFO_PATH}

  calculated-state-path = "data/calculated_state"
  calculated-state-path = ${?CL_CALCULATED_STATE_PATH}

  global-snapshots-with-state-path= "data/global_snapshots/snapshots_with_state"
  global-snapshots-with-state-path = ${?CL_GLOBAL_SNAPSHOTS_WITH_STATE_PATH}

  global-snapshots-with-state-deltas-path= "data/global_snapshots/snapshots_with_state_deltas"
  global-snapshots-with-state-deltas-path = ${?CL_GLOBAL_SNAPSHOTS_WITH_STATE_DELTAS_PATH}

  max-global-snapshots-with-state-stored = 2
  max-global-snapshots-with-state-deltas-stored = 100

  combined-snapshot-checkpoint-path = "data/combined_snapshot_checkpoint"
  combined-snapshot-checkpoint-path = ${?CL_COMBINED_SNAPSHOT_CHECKPOINT_PATH}
}

state-channel {
  pull-delay = 0
  purge-delay = 5
}

peer-discovery {
  delay {
    check-peers-attempt-delay = 1 minute
    check-peers-max-delay = 10 minutes
    additional-discovery-delay = 0 minutes
    min-peers = 1
  }
}

incremental {
  last-full-global-snapshot-ordinal {
    mainnet: 766717
    testnet: 736766
    integrationnet: 0
    dev: 0
  }
}

# Optional seedlist-signed recovery checkpoint. When set, the recovery download path follows only the
# chain passing through the verified checkpoint's (ordinal, hash) -- the fork-safety anchor for recovery.
# Inert when unset. The file is a JSON Signed[RecoveryCheckpoint] signed by a majority of the seedlist.
recovery {
  checkpoint-path = ${?CL_RECOVERY_CHECKPOINT_PATH}
}

# Per-IP rate limit on public /global-snapshots/* routes. Guards against
# community peer clients polling tight-loop from the same source IP.
# Overrides the defaults in application.conf.
#
# Per-IP caps on the PUBLIC snapshot routes (port 9000). Some validator-to-validator traffic
# (chain-tip sampling, ordinal-hash agreement) ALSO transits the public port, so caps here
# are not strictly an "anonymous-clients-only" throttle. Use the per-ip-allowlist (env var
# CL_SNAPSHOT_PER_IP_ALLOWLIST) to exempt operator-controlled validator IPs from the cap.
#
# Tightened from 30 -> 10 req/min and 300 -> 100 MB/min for egress
# containment after observing third-party pollers driving the bulk of public:9000 egress.
#
# Subsequently raised request cap from 10 -> 120 req/min (= 2/sec sustained) following
# observation that 10/min was suffocating legitimate intra-cluster gossip when validator IPs
# were not allowlisted. With a 14-peer cluster, each peer issues chain-tip + ordinal + hash
# probes against the public port at a cadence that easily breaks 10/min, and a missed tip
# probe degrades the leader's facility quorum on the next round. 120/min preserves the
# anti-abuse property (a single non-allowlisted IP still cannot exceed 2 req/sec) while
# giving honest peers ~10x headroom over the steady-state poll rate. The bandwidth cap
# (100 MB/min) is retained as the hard egress ceiling -- that's what actually bounds the
# bulk-poller threat, not the request count.
snapshot-serving {
  per-ip-max-requests-per-window = 120
  per-ip-max-requests-per-window = ${?CL_SNAPSHOT_PER_IP_MAX_REQUESTS_PER_WINDOW}
  # Per-IP bandwidth cap. Applies only to heavyweight snapshot routes
  # (latest/combined/stream + per-ordinal checkpoint stream). 100 MB / 1 minute ~=
  # 1.6 MiB/s sustained per IP -- fits one ~60-72 MB combined snapshot per minute, a fair
  # ration for a cooperative anonymous client and an obvious throttle on bulk re-pollers.
  # Set to 0 to disable the bandwidth limiter entirely.
  per-ip-max-bytes-per-window = 104857600
  per-ip-max-bytes-per-window = ${?CL_SNAPSHOT_PER_IP_MAX_BYTES_PER_WINDOW}
  # Longer-window integral byte budget. The 1-minute cap catches short bursts; this
  # 5-minute cap catches sustained pollers that stay barely under the short cap.
  # 300 MB / 5 minutes ~= 1 MiB/s sustained per IP.
  per-ip-max-bytes-per-long-window = 314572800
  per-ip-max-bytes-per-long-window = ${?CL_SNAPSHOT_PER_IP_MAX_BYTES_PER_LONG_WINDOW}
  per-ip-long-window = 5 minutes
  per-ip-long-window = ${?CL_SNAPSHOT_PER_IP_LONG_WINDOW}
  # Node-wide long-window byte budget for heavyweight snapshot routes. This is not bypassed
  # by the per-IP allowlist, so trusted high-rate consumers cannot push one source node above
  # the aggregate budget. 1,500,000,000 bytes / 5 minutes = 5 MB/s decimal sustained.
  max-bytes-per-long-window = 1500000000
  max-bytes-per-long-window = ${?CL_SNAPSHOT_MAX_BYTES_PER_LONG_WINDOW}
  long-window = 5 minutes
  long-window = ${?CL_SNAPSHOT_LONG_WINDOW}
  # Adaptive heavy-route backoff. This is intentionally softer than the hard byte caps:
  # over-eager pollers get a Retry-After that grows from 3s toward 5m and decays over
  # time. By default this does NOT apply to allowlisted clients (see
  # adaptive-backoff-apply-to-allowlist below) -- allowlisted infra is exempt, matching the
  # hard per-IP caps. Flip that knob to true to also nudge trusted infra away from
  # tight-loop combined-stream polling without removing it from the allowlist.
  adaptive-backoff-enabled = true
  adaptive-backoff-enabled = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_ENABLED}
  adaptive-backoff-max-requests-per-window = 60
  adaptive-backoff-max-requests-per-window = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_MAX_REQUESTS_PER_WINDOW}
  adaptive-backoff-max-bytes-per-window = 750000000
  adaptive-backoff-max-bytes-per-window = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_MAX_BYTES_PER_WINDOW}
  adaptive-backoff-window = 5 minutes
  adaptive-backoff-window = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_WINDOW}
  adaptive-backoff-base-retry-after-seconds = 3
  adaptive-backoff-base-retry-after-seconds = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_BASE_RETRY_AFTER_SECONDS}
  adaptive-backoff-max-retry-after-seconds = 300
  adaptive-backoff-max-retry-after-seconds = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_MAX_RETRY_AFTER_SECONDS}
  adaptive-backoff-penalty-decay = 5 minutes
  adaptive-backoff-penalty-decay = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_PENALTY_DECAY}
  # false (default): allowlisted IPs bypass adaptive backoff just as they bypass the hard
  # per-IP caps. true: subject allowlisted infra to the soft Retry-After nudge only.
  adaptive-backoff-apply-to-allowlist = false
  adaptive-backoff-apply-to-allowlist = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_APPLY_TO_ALLOWLIST}
}
