state-after-joining = WaitingForDownload

trust {
  daemon {
    interval = 10 minutes
  }
}

snapshot {
  consensus {
    time-trigger-interval = 43 seconds
    time-trigger-interval = ${?CL_TIME_TRIGGER_INTERVAL}
    declaration-timeout = 45 seconds
    declaration-timeout = ${?CL_DECLARATION_TIMEOUT}
    declaration-range-limit = 3
    lock-duration = 10 seconds
    re-stall-timeout = 15 seconds
    re-stall-timeout = ${?CL_RE_STALL_TIMEOUT}
    max-stall-cycles = 3
    max-round-duration = 5 minutes
    max-round-duration = ${?CL_MAX_ROUND_DURATION}
    removal-penalty-rounds = 5
    removal-penalty-rounds = ${?CL_REMOVAL_PENALTY_ROUNDS}
    exponential-penalty-base = 2
    exponential-penalty-base = ${?CL_EXPONENTIAL_PENALTY_BASE}
    max-removal-penalty-rounds = 100
    max-removal-penalty-rounds = ${?CL_MAX_REMOVAL_PENALTY_ROUNDS}
    candidate-deferral-rounds = 3
    candidate-deferral-rounds = ${?CL_CANDIDATE_DEFERRAL_ROUNDS}
    # Bounds which commit signatures land in the certified commit evidence. Consensus-critical:
    # in deterministicConfigHash, so every node in the cluster must use the same value. Setting
    # CL_SIGNATURE_GRACE_PERIOD on one node changes its config hash and the L0 join fence rejects it.
    signature-grace-period = 3 seconds
    signature-grace-period = ${?CL_SIGNATURE_GRACE_PERIOD}

    event-cutter {
      max-binary-size-bytes = 20971520
      max-update-node-parameters-size = 100
    }

    # GL0 state-channel acceleration counts newly inserted trigger intent, not total mempool backlog.
    # Nine is ceil(43s TimeTrigger / 5s EventTrigger cooldown): steady one-at-a-time submissions
    # naturally coalesce over one normal round, while a real burst can still request an EventTrigger.
    # Non-state-channel GL0 events remain immediate and do not use this batch threshold.
    event-trigger-threshold = 9
    event-trigger-threshold = ${?CL_EVENT_TRIGGER_THRESHOLD}
    event-trigger-cooldown = 5s
    event-trigger-cooldown = ${?CL_EVENT_TRIGGER_COOLDOWN}
    fork-lag-threshold = 10
    fork-lag-threshold = ${?CL_FORK_LAG_THRESHOLD}
    # Reverted prior tightenings back to the alpha.52 baseline. The
    # combined effect of the earlier tightenings (0.67 -> 0.6 quorum, 0.5 -> 0.6 ratio,
    # then 0.6 -> 0.7 ratio, 10 -> 30 floor) was a death spiral: stricter ratios shrank
    # eligible to the point where even source nodes (e2f4496e:21/31 = 0.677) crossed
    # below the 0.7 line and got excluded by their own classifier. The supposed alpha.55
    # wedge fix made things worse; the cluster ran stably for 5 days on the alpha.52
    # values (0.67/0.5/10). The wider witness pool + peersAtHigherKey gate provide the
    # BFT-safety and liveness reinforcements that the tightenings were targeting, without
    # compressing eligible.
    # Adjusted 0.67 -> 0.6666666666666666 (max-precision Double approximation of
    # 2/3 exact). The decimal 0.67 rounded up unfavorably for N divisible by 3: for N=6,
    # ceil(6 * 0.67) = ceil(4.02) = 5 instead of the BFT-intended ceil(2N/3) = 4. This
    # off-by-one caused the wedges where 4-of-6 responsive facilitators
    # failed quorum (4 < 5) and the ViewChangeCertificate escape hatch also wedged
    # because VCC uses the same threshold. BFT safety preserved for f=1: any two
    # quorums of size 4 over N=6 intersect in at least 2*4 - 6 = 2 replicas. Tradeoff:
    # implicit f=2 tolerance (q=5 of N=6) reduced to f=1 (q=4 of N=6); observed silent
    # peers are crash-faulty (network/JVM hang), not byzantine, so the f=1 bound is
    # adequate. Coordinated cold restart required because this value is in
    # deterministicConfigHash (and consensusSchemaVersion is bumped as a fence).
    quorum-threshold-fraction = 0.6666666666666666
    quorum-threshold-fraction = ${?CL_QUORUM_THRESHOLD_FRACTION}
    # Defensive force-VCV threshold. After N consecutive same-key
    # abandonments StallDetector forces a VCV emission regardless of the per-round
    # "missing-still-responsive" gate. Default 3 fires after ~170s (3 * ~57s/abandon
    # cycle) and gives the new view ~115s of cushion before the recovery threshold
    # (maxConsecutiveAbandonments=5 * ~57s = ~285s) would have fired. Strictly less
    # than maxConsecutiveAbandonments so the new view has time to converge before
    # the recovery escalation point. Consensus-critical: in deterministicConfigHash.
    force-view-change-abandonments = 3
    force-view-change-abandonments = ${?CL_FORCE_VIEW_CHANGE_ABANDONMENTS}
    # `tightening-window` sizes the recentRoundEndTimes window. `active-facilitator-floor` is
    # the minimum ready participation the rollback / first-round gates require.
    # Both are consensus-critical: divergent operator values are rejected at the L0 join fence.
    tightening-window = 10
    tightening-window = ${?CL_TIGHTENING_WINDOW}
    active-facilitator-floor = 3
    active-facilitator-floor = ${?CL_ACTIVE_FACILITATOR_FLOOR}
    active-admission-max-expansion-per-round = 1
    active-admission-max-expansion-per-round = ${?CL_ACTIVE_ADMISSION_MAX_EXPANSION_PER_ROUND}
    active-admission-expansion-interval-rounds = 5
    active-admission-expansion-interval-rounds = ${?CL_ACTIVE_ADMISSION_EXPANSION_INTERVAL_ROUNDS}
    # Facilitator-selector cap (FacilitatorSelector). Identical on every environment.
    max-facilitator-count = 1000
  }

  # Contraction floor for membership clearing ONLY. A clearing removal that would leave the next committee
  # below this size waits unless it is paired with a replacement admission in the same transition. It
  # never blocks admission: a committee still growing toward the floor (for example a recovery-seed
  # root of 3) can only replace members, not shrink. Must be >= 3. Consensus-critical (in
  # deterministicConfigHash).
  min-committee-size {
    mainnet: 10
    testnet: 4
    integrationnet: 4
    dev: 3
  }

  # V35 certified-outcome activation in this L0's own snapshot-ordinal space. This build has
  # no pre-v35 Global L0 engine: a node replays/downloads keys below activation but refuses to
  # PRODUCE one, so every produced key must be >= this value.
  #
  # dev/testnet/integrationnet start certified at genesis. Consensus installs the first
  # incremental root at ordinal 1; activation 0 therefore authorizes that exact canonical
  # root, not a nonexistent incremental ordinal 0.
  #
  # MAINNET 9999999 IS A PLACEHOLDER (nodes refuse to produce until it is pinned). It is ONE
  # of the ordinals decided together at the mainnet v3.5 -> v4.1 cold-restart cutover:
  #   1. here: mainnet = R, the final v3.5 global snapshot ordinal. R is also the rollback
  #      anchor used with CL_GL0_RECOVERY_SEED_COMMITTEE. Activation is exact-key and must be
  #      <= that anchor (recovery-seed startup rejects an anchor below activation).
  #   2. fields-added-ordinals.tessellation-41-migration.mainnet in node-shared
  #      application.conf = R+1, so R itself still replays with v3.5 rules.
  #   3. fields-added-ordinals.gl0-clearing.mainnet (ADR-0036 item 8). While it stays 9999999,
  #      mainnet has no health-based removal: a seated member that stops signing but keeps its
  #      seedlist slot and collateral stays seated, costing a view change on each leader turn.
  # Procedure: halt v3.5 and confirm the source nodes share tip R and its hash; start the lead
  # source node with run-rollback --rollback-hash H(R) and the other sources with
  # run-validator, all with CL_GL0_RECOVERY_SEED_COMMITTEE set to the source-node committee;
  # wait until R+1 is certified, R+2 carries its QC and
  # dag_consensus_recovery_seed_boundary_publicly_durable == 1; then unset the env var on the
  # sources (it re-arms on every fresh JVM). Community validators re-join through ordinary
  # download (validated from the public recovery root) and open admission.
  certified-consensus-activation-ordinal {
    mainnet: 9999999
    testnet: 0
    integrationnet: 0
    dev: 0
  }


  in-memory-capacity = 10

  snapshot-path = "data/snapshot"
  snapshot-path = ${?CL_SNAPSHOT_STORED_PATH}

  incremental-tmp-snapshot-path = "data/incremental_snapshot_tmp"
  incremental-tmp-snapshot-path = ${?CL_INCREMENTAL_SNAPSHOT_TMP_STORED_PATH}

  incremental-persisted-snapshot-path = "data/incremental_snapshot"
  incremental-persisted-snapshot-path = ${?CL_INCREMENTAL_SNAPSHOT_STORED_PATH}

  snapshot-info-path = "data/snapshot_info"
  snapshot-info-path = ${?CL_SNAPSHOT_INFO_PATH}

  calculated-state-path = "data/calculated_state"
  calculated-state-path = ${?CL_CALCULATED_STATE_PATH}

  global-snapshots-with-state-path= "data/global_snapshots/snapshots_with_state"
  global-snapshots-with-state-path = ${?CL_GLOBAL_SNAPSHOTS_WITH_STATE_PATH}

  global-snapshots-with-state-deltas-path= "data/global_snapshots/snapshots_with_state_deltas"
  global-snapshots-with-state-deltas-path = ${?CL_GLOBAL_SNAPSHOTS_WITH_STATE_DELTAS_PATH}

  max-global-snapshots-with-state-stored = 2
  max-global-snapshots-with-state-deltas-stored = 100

  combined-snapshot-checkpoint-path = "data/combined_snapshot_checkpoint"
  combined-snapshot-checkpoint-path = ${?CL_COMBINED_SNAPSHOT_CHECKPOINT_PATH}
}

state-channel {
  pull-delay = 0
  purge-delay = 5
}

peer-discovery {
  delay {
    check-peers-attempt-delay = 1 minute
    check-peers-max-delay = 10 minutes
    additional-discovery-delay = 0 minutes
    min-peers = 1
  }
}

incremental {
  last-full-global-snapshot-ordinal {
    mainnet: 766717
    testnet: 0
    integrationnet: 0
    dev: 0
  }
}

# Per-IP rate limit on public /global-snapshots/* routes. Guards against
# community peer clients polling tight-loop from the same source IP.
# Overrides the defaults in application.conf.
#
# Per-IP caps on the PUBLIC snapshot routes (port 9000). Some validator-to-validator traffic
# (chain-tip sampling, ordinal-hash agreement) ALSO transits the public port, so caps here
# are not strictly an "anonymous-clients-only" throttle. Use the per-ip-allowlist (env var
# CL_SNAPSHOT_PER_IP_ALLOWLIST) to exempt operator-controlled validator IPs from the cap.
#
# Tightened from 30 -> 10 req/min and 300 -> 100 MB/min for egress
# containment after observing third-party pollers driving the bulk of public:9000 egress.
#
# Subsequently raised request cap from 10 -> 120 req/min (= 2/sec sustained) following
# observation that 10/min was suffocating legitimate intra-cluster gossip when validator IPs
# were not allowlisted. With a 14-peer cluster, each peer issues chain-tip + ordinal + hash
# probes against the public port at a cadence that easily breaks 10/min, and a missed tip
# probe degrades the leader's facility quorum on the next round. 120/min preserves the
# anti-abuse property (a single non-allowlisted IP still cannot exceed 2 req/sec) while
# giving honest peers ~10x headroom over the steady-state poll rate. The bandwidth cap
# (100 MB/min) is retained as the hard egress ceiling -- that's what actually bounds the
# bulk-poller threat, not the request count.
snapshot-serving {
  per-ip-max-requests-per-window = 120
  per-ip-max-requests-per-window = ${?CL_SNAPSHOT_PER_IP_MAX_REQUESTS_PER_WINDOW}
  # Per-IP bandwidth cap. Applies only to heavyweight snapshot routes
  # (latest/combined/stream + per-ordinal checkpoint stream). 100 MB / 1 minute ~=
  # 1.6 MiB/s sustained per IP -- fits one ~60-72 MB combined snapshot per minute, a fair
  # ration for a cooperative anonymous client and an obvious throttle on bulk re-pollers.
  # Set to 0 to disable the bandwidth limiter entirely.
  per-ip-max-bytes-per-window = 104857600
  per-ip-max-bytes-per-window = ${?CL_SNAPSHOT_PER_IP_MAX_BYTES_PER_WINDOW}
  # Longer-window integral byte budget. The 1-minute cap catches short bursts; this
  # 5-minute cap catches sustained pollers that stay barely under the short cap.
  # 300 MB / 5 minutes ~= 1 MiB/s sustained per IP.
  per-ip-max-bytes-per-long-window = 314572800
  per-ip-max-bytes-per-long-window = ${?CL_SNAPSHOT_PER_IP_MAX_BYTES_PER_LONG_WINDOW}
  per-ip-long-window = 5 minutes
  per-ip-long-window = ${?CL_SNAPSHOT_PER_IP_LONG_WINDOW}
  # Node-wide long-window byte budget for heavyweight snapshot routes. This is not bypassed
  # by the per-IP allowlist, so trusted high-rate consumers cannot push one source node above
  # the aggregate budget. 1,500,000,000 bytes / 5 minutes = 5 MB/s decimal sustained.
  max-bytes-per-long-window = 1500000000
  max-bytes-per-long-window = ${?CL_SNAPSHOT_MAX_BYTES_PER_LONG_WINDOW}
  long-window = 5 minutes
  long-window = ${?CL_SNAPSHOT_LONG_WINDOW}
  # Adaptive heavy-route backoff. This is intentionally softer than the hard byte caps:
  # over-eager pollers get a Retry-After that grows from 3s toward 5m and decays over
  # time. By default this does NOT apply to allowlisted clients (see
  # adaptive-backoff-apply-to-allowlist below) -- allowlisted infra is exempt, matching the
  # hard per-IP caps. Flip that knob to true to also nudge trusted infra away from
  # tight-loop combined-stream polling without removing it from the allowlist.
  adaptive-backoff-enabled = true
  adaptive-backoff-enabled = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_ENABLED}
  adaptive-backoff-max-requests-per-window = 60
  adaptive-backoff-max-requests-per-window = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_MAX_REQUESTS_PER_WINDOW}
  adaptive-backoff-max-bytes-per-window = 750000000
  adaptive-backoff-max-bytes-per-window = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_MAX_BYTES_PER_WINDOW}
  adaptive-backoff-window = 5 minutes
  adaptive-backoff-window = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_WINDOW}
  adaptive-backoff-base-retry-after-seconds = 3
  adaptive-backoff-base-retry-after-seconds = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_BASE_RETRY_AFTER_SECONDS}
  adaptive-backoff-max-retry-after-seconds = 300
  adaptive-backoff-max-retry-after-seconds = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_MAX_RETRY_AFTER_SECONDS}
  adaptive-backoff-penalty-decay = 5 minutes
  adaptive-backoff-penalty-decay = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_PENALTY_DECAY}
  # false (default): allowlisted IPs bypass adaptive backoff just as they bypass the hard
  # per-IP caps. true: subject allowlisted infra to the soft Retry-After nudge only.
  adaptive-backoff-apply-to-allowlist = false
  adaptive-backoff-apply-to-allowlist = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_APPLY_TO_ALLOWLIST}
}
