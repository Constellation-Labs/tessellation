state-after-joining = WaitingForDownload

trust {
  daemon {
    interval = 10 minutes
  }
}

snapshot {
  consensus {
    time-trigger-interval = 43 seconds
    time-trigger-interval = ${?CL_TIME_TRIGGER_INTERVAL}
    declaration-timeout = 45 seconds
    declaration-timeout = ${?CL_DECLARATION_TIMEOUT}
    declaration-range-limit = 3
    lock-duration = 10 seconds
    max-facilitator-count = 20
    re-stall-timeout = 15 seconds
    re-stall-timeout = ${?CL_RE_STALL_TIMEOUT}
    max-stall-cycles = 3
    max-round-duration = 5 minutes
    max-round-duration = ${?CL_MAX_ROUND_DURATION}
    removal-penalty-rounds = 3

    event-cutter {
      max-binary-size-bytes = 20971520
      max-update-node-parameters-size = 100
    }

    event-trigger-threshold = 1
    event-trigger-cooldown = 5s
    event-trigger-cooldown = ${?CL_EVENT_TRIGGER_COOLDOWN}
  }

  in-memory-capacity = 10

  snapshot-path = "data/snapshot"
  snapshot-path = ${?CL_SNAPSHOT_STORED_PATH}

  incremental-tmp-snapshot-path = "data/incremental_snapshot_tmp"
  incremental-tmp-snapshot-path = ${?CL_INCREMENTAL_SNAPSHOT_TMP_STORED_PATH}

  incremental-persisted-snapshot-path = "data/incremental_snapshot"
  incremental-persisted-snapshot-path = ${?CL_INCREMENTAL_SNAPSHOT_STORED_PATH}

  snapshot-info-path = "data/snapshot_info"
  snapshot-info-path = ${?CL_SNAPSHOT_INFO_PATH}

  calculated-state-path = "data/calculated_state"
  calculated-state-path = ${?CL_CALCULATED_STATE_PATH}

  global-snapshots-with-state-path= "data/global_snapshots/snapshots_with_state"
  global-snapshots-with-state-path = ${?CL_GLOBAL_SNAPSHOTS_WITH_STATE_PATH}

  global-snapshots-with-state-deltas-path= "data/global_snapshots/snapshots_with_state_deltas"
  global-snapshots-with-state-deltas-path = ${?CL_GLOBAL_SNAPSHOTS_WITH_STATE_DELTAS_PATH}

  max-global-snapshots-with-state-stored = 2
  max-global-snapshots-with-state-deltas-stored = 100

  combined-snapshot-checkpoint-path = "data/combined_snapshot_checkpoint"
  combined-snapshot-checkpoint-path = ${?CL_COMBINED_SNAPSHOT_CHECKPOINT_PATH}
}

state-channel {
  pull-delay = 0
  purge-delay = 5
}

peer-discovery {
  delay {
    check-peers-attempt-delay = 1 minute
    check-peers-max-delay = 10 minutes
    additional-discovery-delay = 0 minutes
    min-peers = 1
  }
}

incremental {
  last-full-global-snapshot-ordinal {
    mainnet: 766717
    testnet: 736766
    integrationnet: 0
    dev: 0
  }
}
