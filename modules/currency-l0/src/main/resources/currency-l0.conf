state-after-joining = WaitingForDownload

peer-discovery {
  delay {
    check-peers-attempt-delay = 1 minute
    check-peers-max-delay = 10 minutes
    additional-discovery-delay = 0 minutes
    min-peers = 1
  }
}

health-check {
  remove-unresponsive-parallel-peers-after = 10 seconds
  request-proposals-after = 8 seconds
}

snapshot {
  max-facilitator-count {
    mainnet: 1000
    testnet: 1000
    integrationnet: 1000
    dev: 1000
  }

  # v19 multi-committee Core floor per environment. Mirror of dag-l0.conf; see that
  # file for the full rationale.
  core-committee-size {
    mainnet: 15
    # v22: lowered 3 -> 2 (mirror of dag-l0.conf; see that file for the full rationale).
    # Lets the tier-demotion hysteresis shed a sustained non-signer instead of the floor
    # re-promoting it every round. Demotion gated by TierTransitions.DemotionConsecutiveMisses.
    testnet: 2
    integrationnet: 9
    dev: 3
  }

  # V35 certified-outcome activation in this Currency L0's independent ordinal
  # space. Public environments remain absent until each metagraph/operator selects
  # and coordinates its own activation boundary; dev activates at genesis.
  certified-consensus-activation-ordinal {
    dev: 0
  }

  # v33 quorum-denominator shrink activation threshold. Mirror of dag-l0.conf; see that file for
  # the full rationale. 0 = disabled; mainnet/integrationnet/dev are explicitly off for launch.
  quorum-shrink-activation-views {
    mainnet: 0
    integrationnet: 0
    dev: 0
    testnet: 10
  }

  # Bounded sticky probation lane for active-facilitator admission. Mirror of dag-l0.conf; see
  # that file for the full rationale. A peer that signs the latest round keeps priority for a
  # bounded non-Core seat until it reaches the retain band; missing ends that lease. This layer
  # reserves one Core-sized cohort per round in every environment. Folded into
  # deterministicConfigHash.
  active-admission-min-probation-reentry-slots {
    mainnet: 15
    integrationnet: 9
    dev: 3
    testnet: 2
  }

  # Recent-signer pool lookback depth (in ordinals) for active-facilitator admission. Mirror of
  # dag-l0.conf; see that file for the full rationale. Decoupled from the demotion hysteresis (3);
  # widening only steadies/broadens the reward set, never Core/liveness. Floored to 3 at the
  # construction site. Folded into deterministicConfigHash. UNIFORM RULE: the full persisted
  # recentSigners window (= tightening-window, 10) on every environment.
  active-admission-recent-signer-window {
    mainnet: 10
    integrationnet: 10
    dev: 10
    dev: ${?CL_ACTIVE_ADMISSION_RECENT_SIGNER_WINDOW}
    testnet: 10
    testnet: ${?CL_ACTIVE_ADMISSION_RECENT_SIGNER_WINDOW}
  }

  consensus {
    time-trigger-interval = 43 seconds
    time-trigger-interval = ${?CL_TIME_TRIGGER_INTERVAL}
    declaration-timeout = 50 seconds
    declaration-timeout = ${?CL_DECLARATION_TIMEOUT}
    declaration-range-limit = 3
    lock-duration = 10 seconds
    peers-declaration-timeout = 10 seconds
    max-facilitator-count = 20
    re-stall-timeout = 15 seconds
    re-stall-timeout = ${?CL_RE_STALL_TIMEOUT}
    max-stall-cycles = 3
    max-round-duration = 5 minutes
    max-round-duration = ${?CL_MAX_ROUND_DURATION}
    removal-penalty-rounds = 5
    removal-penalty-rounds = ${?CL_REMOVAL_PENALTY_ROUNDS}
    exponential-penalty-base = 2
    exponential-penalty-base = ${?CL_EXPONENTIAL_PENALTY_BASE}
    max-removal-penalty-rounds = 100
    max-removal-penalty-rounds = ${?CL_MAX_REMOVAL_PENALTY_ROUNDS}
    candidate-deferral-rounds = 3
    candidate-deferral-rounds = ${?CL_CANDIDATE_DEFERRAL_ROUNDS}

    event-cutter {
      max-binary-size-bytes = 20971520
      max-update-node-parameters-size = 100
    }

    event-trigger-threshold = 1
    event-trigger-cooldown = 5s
    event-trigger-cooldown = ${?CL_EVENT_TRIGGER_COOLDOWN}
    fork-lag-threshold = 10
    fork-lag-threshold = ${?CL_FORK_LAG_THRESHOLD}
    quorum-threshold-fraction = 1.0
    quorum-threshold-fraction = ${?CL_QUORUM_THRESHOLD_FRACTION}
    min-participation-observations = 10
    min-participation-observations = ${?CL_MIN_PARTICIPATION_OBSERVATIONS}
    # Reverted 0.7 -> 0.5. Mirrored from dag-l0.conf -- see that file for the rationale.
    min-participation-ratio = 0.5
    min-participation-ratio = ${?CL_MIN_PARTICIPATION_RATIO}
    # Reverted 30 -> 10. Mirrored from dag-l0.conf.
    min-observation-history-floor = 10
    min-observation-history-floor = ${?CL_MIN_OBSERVATION_HISTORY_FLOOR}
    lock-on-vote-protocol-version = 2
    lock-on-vote-protocol-version = ${?CL_LOCK_ON_VOTE_PROTOCOL_VERSION}
  }

  in-memory-capacity = 10

  snapshot-path = "data/snapshot"
  snapshot-path = ${?CL_SNAPSHOT_STORED_PATH}

  incremental-tmp-snapshot-path = "data/incremental_snapshot_tmp"
  incremental-tmp-snapshot-path = ${?CL_INCREMENTAL_SNAPSHOT_TMP_STORED_PATH}

  incremental-persisted-snapshot-path = "data/incremental_snapshot"
  incremental-persisted-snapshot-path = ${?CL_INCREMENTAL_SNAPSHOT_STORED_PATH}

  snapshot-info-path = "data/snapshot_info"
  snapshot-info-path = ${?CL_SNAPSHOT_INFO_PATH}

  calculated-state-path = "data/calculated_state"
  calculated-state-path = ${?CL_CALCULATED_STATE_PATH}

  global-snapshots-with-state-path= "data/global_snapshots/snapshots_with_state"
  global-snapshots-with-state-path = ${?CL_GLOBAL_SNAPSHOTS_WITH_STATE_PATH}

  global-snapshots-with-state-deltas-path= "data/global_snapshots/snapshots_with_state_deltas"
  global-snapshots-with-state-deltas-path = ${?CL_GLOBAL_SNAPSHOTS_WITH_STATE_DELTAS_PATH}

  max-global-snapshots-with-state-stored = 2
  max-global-snapshots-with-state-deltas-stored = 100

  combined-snapshot-checkpoint-path = "data/combined_snapshot_checkpoint"
  combined-snapshot-checkpoint-path = ${?CL_COMBINED_SNAPSHOT_CHECKPOINT_PATH}
}

# Per-IP caps on the PUBLIC snapshot routes -- see dag-l0.conf for full rationale.
# Tightened 30 -> 10 req/min and 300 -> 100 MB/min to strongly prefer
# the peer-id-authenticated p2p path over anonymous public traffic.
# Subsequently raised request cap 10 -> 120 req/min in lockstep with dag-l0 after
# observing the 10/min cap suffocate intra-cluster chain-tip + ordinal-hash gossip on
# the public port. Bandwidth cap unchanged -- that's the hard egress ceiling.
snapshot-serving {
  per-ip-max-requests-per-window = 120
  per-ip-max-requests-per-window = ${?CL_SNAPSHOT_PER_IP_MAX_REQUESTS_PER_WINDOW}
  per-ip-max-bytes-per-window = 104857600
  per-ip-max-bytes-per-window = ${?CL_SNAPSHOT_PER_IP_MAX_BYTES_PER_WINDOW}
}
