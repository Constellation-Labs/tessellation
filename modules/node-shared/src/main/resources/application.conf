gossip {
  storage {
    peer-rumors-capacity = 50
    active-common-rumors-capacity = 20
    seen-common-rumors-capacity = 50
  }
  daemon {
    peer-round {
      fanout = 1
      interval = 0.2 seconds
      max-concurrent-rounds = 8
    }
    common-round {
      fanout = 1
      interval = 0.5 seconds
      max-concurrent-rounds = 4
    }
  }
  timeouts {
    routes = 10 seconds
    client = 5 seconds
  }
}

