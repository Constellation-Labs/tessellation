fields-added-ordinals {
  # Every threshold map uses the same fallback: a missing environment resolves to
  # SnapshotOrdinal.MaxValue and remains disabled. Use an explicit 0 for active-from-genesis
  # behavior. Exact-key maps such as dust-sweeps are disabled naturally when absent.
  #
  # Mainnet values are v3.5 signed history: each records the ordinal at which that rule entered mainnet
  # and must never move (the placeholder 9999999 marks rules that only start at the v4.1 cutover).
  # testnet and integrationnet are fresh-genesised on v4.1 and carry no older history, so every rule
  # applies from genesis there: they use 0, exactly like dev. FieldsAddedOrdinalsSuite enforces this.
  tessellation-3-migration {
    mainnet: 4409045,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  tessellation-301-migration {
    mainnet: 4915254,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  check-sync-global-snapshot-field {
    mainnet: 4488000,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  metagraph-sync-data {
    mainnet: 4915254,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  updated-last-sync-global-order {
    mainnet: 4915254,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  updated-last-sync-global-from-peers-in-consensus {
    mainnet: 4915254,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  updating-combine-function-spend-actions {
    mainnet: 4957662,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  fixing-allow-spend-expiration {
    mainnet: 5033174,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  fixing-allow-spend-and-token-lock-validation {
    mainnet: 5058096,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  # Ordinal-gated GSI dust sweep (state deflation). Per env, keyed by the ordinal each sweep fires at (exact-key match).
  # Burn = omit collection-address (None); credit a treasury = collection-address: "DAG...". threshold is in datum.
  # FINALIZE the ordinal right before deploy: it must be one the chain reaches AFTER the deflating jar is live cluster-wide.
  # A too-early crossing on the old jar misses the sweep until a rollback re-crosses it. Bump it up if the chain nears it
  # before the coordinated cold restart completes, or if the chain looks unhealthy. No sweep is scheduled on any
  # network: testnet's 3154700 sweep belonged to history that the v4.1 fresh genesis discards.
  dust-sweeps {}
  # Checked arithmetic in acceptFeeTxs. Set to the global ordinal of the mint so everything at or below
  # it replays through the original wrapping path and reproduces the state that was actually signed,
  # while everything above uses the corrected arithmetic. This gate is deliberately set inside signed
  # history: the point is to preserve that history, not to change it.
  fixing-fee-transaction-balance-overflow {
    mainnet: 6814499,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  # At/after this global ordinal every fee transaction in a data envelope is validated and a data block whose
  # fees cannot be applied is rejected. Activate only after every Currency L1 and ML0 node is upgraded, and
  # never at an ordinal already present in signed history.
  fixing-data-application-fee-validation {
    mainnet: 6818000,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  # Historical boundary for allow-spend destination-credit behavior. Live Currency and Global L0 consensus
  # always use escrow semantics; this boundary is used only to recreate signed history. Currency history uses
  # its parent global-sync view and Global history uses its own signed snapshot ordinal.
  fixing-allow-spend-destination-credit {
    mainnet: 6818000,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  # At/after this global ordinal the global layer keeps a record of every allow-spend reference it has retired
  # (accepted a spend transaction against) and refuses to re-add those references to activeAllowSpends, even when
  # a metagraph's own lagging info.activeAllowSpends still reports them. Without this, a reference retired at
  # ordinal G is resurrected at G+1 by the metagraph's pre-sync self-report and can be spent again. Entries are
  # dropped once the allow-spend's lastValidEpochProgress has passed, at which point it is unspendable anyway.
  # Activate only after every Global L0 node is upgraded, and never at an ordinal already present in signed
  # history.
  preventing-allow-spend-resurrection {
    mainnet: 6828500,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  # At/after this global ordinal, an expired global AllowSpend consumed by a SpendAction accepted in the same
  # snapshot is settled once instead of also being refunded to its source. Below it the legacy refund-and-settle
  # behaviour is retained so signed history replays byte-identically. Public-network activation values match the
  # release/mainnet fix.
  fixing-global-allow-spend-expiration {
    mainnet: 6828500,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  # Port of release/mainnet #1498 (088f707eb), live on mainnet since 6176655 (recorded history: do not move).
  # Domain: global ordinal, comparator >=, missing environment = disabled (release/mainnet's reader defaulted a
  # missing entry to MinValue, i.e. always on; every environment is explicit here, so the difference never applies).
  # At/after it an expired withdrawal whose token lock is no longer active is skipped by unlock generation instead
  # of failing with MissingTokenLock, and every expired withdrawal's tokenLockRef is removed from that address's
  # pending withdrawals (orphans included). Below it mainnet never carried an orphan (it halted on the first one).
  # THE v3.5 -> v4.1 CUTOVER ORDINAL C. This is ONE of the TWO ordinals to set at the mainnet v3.5 -> v4.1
  # cold-restart cutover:
  #   1. here: tessellation-41-migration.mainnet = R + 1, where R is the final v3.5 global snapshot ordinal (the
  #      rollback anchor). R itself replays as v3.5; R + 1 is the first v4.1 snapshot.
  #   2. dag-l0.conf: snapshot.certified-consensus-activation-ordinal.mainnet = R (exact key, must be <= the rollback
  #      anchor). The two values are deliberately different.
  # The cutover restarts mainnet through the recovery-seed procedure (CL_GL0_RECOVERY_SEED_COMMITTEE = the source
  # nodes, lead started with run-rollback at R); see docs/operations/fields-added-ordinals.md.
  # From C every v4.1-only replay/state-transition rule applies: per-field MPT sub-trie state-proof roots, fee
  # transaction security (source-authorized co-signers), Currency snapshot protocol 1.0.0, and unique delegated-stake
  # withdrawal settlement. The legacy state-proof and incremental delegated-staking boundaries are derived as C - 1
  # (0 when C is 0) and have no separate keys. mainnet 9999999 is a placeholder (v3.5 forever) until the cutover is
  # pinned; testnet and integrationnet are born on v4.1 and use 0 like dev.
  tessellation-41-migration {
    mainnet: 9999999,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
  removing-processed-delegated-stake-withdrawals {
    mainnet: 6176655,
    testnet: 0,
    integrationnet: 0,
    dev: 0
  }
}

