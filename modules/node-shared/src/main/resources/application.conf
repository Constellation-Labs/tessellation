  mpt-snapshot-info-path = ${?CL_MPT_SNAPSHOT_INFO_PATH}
}

# Snapshot serving guards (concurrency + per-IP rate limit).
# Concurrency cap: simultaneous in-flight requests bounded by a semaphore,
#   excess get 503 + Retry-After.
# Per-IP rate limit: a sliding-window counter keyed by X-Forwarded-For first
#   hop (or connection remote IP) returns 429 + Retry-After when a single IP
#   exceeds its request budget. Set per-ip-max-requests-per-window = 0 to
#   disable the rate limit (concurrency cap still applies).
snapshot-serving {
  max-concurrent-public = 20
  max-concurrent-public = ${?CL_SNAPSHOT_MAX_CONCURRENT_PUBLIC}
  retry-after-seconds = 2
  retry-after-seconds = ${?CL_SNAPSHOT_RETRY_AFTER_SECONDS}
  per-ip-max-requests-per-window = 0
  per-ip-max-requests-per-window = ${?CL_SNAPSHOT_PER_IP_MAX_REQUESTS_PER_WINDOW}
  per-ip-window = 1 minute
  per-ip-window = ${?CL_SNAPSHOT_PER_IP_WINDOW}
  per-ip-retry-after-seconds = 5
  per-ip-retry-after-seconds = ${?CL_SNAPSHOT_PER_IP_RETRY_AFTER_SECONDS}
  per-ip-allowlist = ""
  per-ip-allowlist = ${?CL_SNAPSHOT_PER_IP_ALLOWLIST}
  per-ip-max-bytes-per-long-window = 0
  per-ip-max-bytes-per-long-window = ${?CL_SNAPSHOT_PER_IP_MAX_BYTES_PER_LONG_WINDOW}
  per-ip-long-window = 5 minutes
  per-ip-long-window = ${?CL_SNAPSHOT_PER_IP_LONG_WINDOW}
  max-bytes-per-long-window = 0
  max-bytes-per-long-window = ${?CL_SNAPSHOT_MAX_BYTES_PER_LONG_WINDOW}
  long-window = 5 minutes
  long-window = ${?CL_SNAPSHOT_LONG_WINDOW}
  adaptive-backoff-enabled = false
  adaptive-backoff-enabled = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_ENABLED}
  adaptive-backoff-max-requests-per-window = 0
  adaptive-backoff-max-requests-per-window = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_MAX_REQUESTS_PER_WINDOW}
  adaptive-backoff-max-bytes-per-window = 0
  adaptive-backoff-max-bytes-per-window = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_MAX_BYTES_PER_WINDOW}
  adaptive-backoff-window = 5 minutes
  adaptive-backoff-window = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_WINDOW}
  adaptive-backoff-base-retry-after-seconds = 3
  adaptive-backoff-base-retry-after-seconds = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_BASE_RETRY_AFTER_SECONDS}
  adaptive-backoff-max-retry-after-seconds = 300
  adaptive-backoff-max-retry-after-seconds = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_MAX_RETRY_AFTER_SECONDS}
  adaptive-backoff-penalty-decay = 5 minutes
  adaptive-backoff-penalty-decay = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_PENALTY_DECAY}
  adaptive-backoff-apply-to-allowlist = false
  adaptive-backoff-apply-to-allowlist = ${?CL_SNAPSHOT_ADAPTIVE_BACKOFF_APPLY_TO_ALLOWLIST}
}

