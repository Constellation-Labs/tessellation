    dev: 0
  }
  set-sum-fix {
    mainnet: 9999999,
    testnet: 9999999,
    integrationnet: 5880000,
    dev: 0
    }
  # Ordinal-gated balance source for state-channel fee affordability (commit dd6e83a19). At/after the ordinal the fee
  # check reads the metagraph owner balance from the deterministic accept() context; below it from the pre-fix
  # mptStore path, so already-signed history re-derives byte-identically. testnet is 0 (the context-source fix is
  # already live there). SET mainnet to the coordinated launch ordinal at deploy -- the placeholder keeps the OLD path.
  sc-fee-balance-from-context {
    # Fee-affordability balance source: deterministic accept() context (ordinal >= gate) vs the
    # pre-fix mptStore.getBalance (ordinal < gate). Set each env to the ordinal where its context
    # build (alpha.0 / dd6e83a19) went live, so replay below the gate reproduces the mptStore-signed
    # history. An absent env fails closed (SnapshotOrdinal.MaxValue) -> stays on the mptStore path.
    mainnet: 9999999        # placeholder: mainnet is on 3.5.x (no v4 fee check); set to the launch checkpoint ordinal at deploy
    testnet: 3101393        # v4.0.0/mptStore ran through ord 3101392 (2026-03-17); alpha.0/context resumed at 3101393 (2026-04-02)
    integrationnet: 5880000 # v4.1.0 activation: context source fires here; the rc.x era below it replays via the mptStore path it ran on
    dev: 0                  # dev networks genesis fresh on the current build, so context applies from ordinal 0
  }
  # Ordinal-gated per-field MPT sub-trie roots in GlobalSnapshotStateProof. At/after the
  # gate, otherwise-empty proof fields carry per-GlobalStateFieldId MPT roots to localize
  # state-root divergence. This changes SIGNED proof bytes, which snapshot-streaming RE-DERIVES and
  # validates, so the snapshot-streaming indexer MUST honor subTrieRootsActivationOrdinal before a
  # network's gate fires -- flipping a network early reintroduces the proof mismatch this work
  # fixes (ADR-0025). integrationnet activates at 5880000 with the v4.1.0 deploy; its
  # snapshot-streaming deployment must carry sub-trie-roots support by that ordinal. mainnet and
  # testnet stay on the pre-field-root proof shape until their own coordinated cross-repo
  # activation AND a cold-restart activation ordinal are both in place.
  sub-trie-roots {
    mainnet: 9999999
    testnet: 9999999
    integrationnet: 5880000
    # Dev deliberately exercises the signed proof shape in every E2E. The CI Snapshot Streaming
    # build is patched to resolve this same ordinal; a stale SS selector now fails CI instead of
    # leaving production compatibility untested.
    dev: 0
  }
  # Delegated validator recipient correction. Below this ordinal, replay the evidence-score
  # payout filter that was briefly deployed; at/after it, pay every frozen Core + Tier-1 member.
  # Set each public environment to the first ordinal produced by the corrected jar. Leaving the
  # placeholder in place preserves history but does NOT activate the fix.
  delegated-rewards-full-committee {
    mainnet: 9999999
    testnet: 9999999
    integrationnet: 5880000
    dev: 0
  }
  # Ordinal-gated GSI dust sweep (state deflation). Per env, keyed by the ordinal each sweep fires at (exact-key match).
  # Burn = omit collection-address (None); credit a treasury = collection-address: "DAG...". threshold is in datum.
  # FINALIZE the ordinal right before deploy: it must be one the chain reaches AFTER the deflating jar is live cluster-wide.
  # A too-early crossing on the old jar misses the sweep until a rollback re-crosses it. Bump it up if the chain nears it
  # before the coordinated cold restart completes, or if the chain looks unhealthy. testnet only for now.
  dust-sweeps {
    testnet: {
      3154700: {
        threshold: 100000
      }
    }
  }
  # Cryptographic source-wallet authorization for metagraph data-update fees. Activate only after
  # every Currency L1 and ML0 node is upgraded. Never activate this gate at an ordinal already
  # present in signed history.
  fee-transaction-security {
    mainnet: 9999999,
    testnet: 9999999,
    integrationnet: 5880000,
    dev: 0
  }
  # Currency snapshot protocol 1.0.0 activates from a consensus-carried Global L0
  # ordinal, not from the Tessellation jar version and not from a per-lineage sentinel.
  # Public entries are deliberately absent until the v35 community rollout is
  # announced. Dev authorizes from genesis; the lineage transitions on its first
  # concrete, non-sentinel retained Global L0 dependency so replay never substitutes a
  # caller's moving tip for an unavailable ordinal.
  currency-snapshot-protocol-v1 {
    dev: 0
  }
  # At/after this global ordinal every fee transaction in a data envelope is validated and a data block whose
  # fees cannot be applied is rejected. Activate only after every Currency L1 and ML0 node is upgraded, and
  # never at an ordinal already present in signed history. testnet and integrationnet are placeholders.
  fixing-data-application-fee-validation {
    mainnet: 6818000,
    testnet: 9999999,
    integrationnet: 9999999,
    dev: 0
  }
  # At/after this global ordinal an allow spend stops crediting its destination at block acceptance.
  # testnet and integrationnet are placeholders.
  fixing-allow-spend-destination-credit {
    mainnet: 6818000,
    testnet: 9999999,
    integrationnet: 9999999,
    dev: 0
  }
}

