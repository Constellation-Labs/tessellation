on:
  push:
    branches:
      - release/integrationnet
      - release/mainnet

name: Release

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if the commit already has a tag starting with "v"
        id: check_tag
        run: |
          TAG=$(git tag --contains HEAD | grep -E '^v' || true)
          if [ -n "$TAG" ]; then
            echo "This commit has a tag starting with 'v': $TAG"
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "This commit does not have a tag starting with 'v'."
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Check branch and abort if necessary
        if: env.TAG_EXISTS == 'true'
        run: |
          echo "Aborting the action because the release should already exist."
          exit 1

      - name: Setup Java and scala
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          JAVA_VERSION: 21
        uses: "./.github/templates/actions/setup_java_and_scala"

      - name: Test
        run: sbt 'scalafmtCheckAll;scalafixAll --check --rules OrganizeImports;test'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove prerelease tags for stable releases
        if: github.ref_name == 'release/mainnet'
        run: |
          # Remove prerelease tags from the local clone so commit-and-tag-version
          # compares against the last stable tag instead of the nearest rc/alpha.
          # This only affects the ephemeral CI runner, not the remote.
          TAGS=$(git tag -l '*-rc.*' '*-alpha.*')
          if [ -n "$TAGS" ]; then
            echo "$TAGS" | xargs git tag -d
            echo "Removed $(echo "$TAGS" | wc -l) prerelease tags locally"
          fi

      - name: Get the release version
        id: get_version
        run: |
          if [[ "${{ github.ref_name }}" == "release/mainnet" ]]; then
            VERSION=$(npx commit-and-tag-version --dry-run | grep -oP 'tagging release v\K[0-9]+\.[0-9]+\.[0-9]+')
          elif [[ "${{ github.ref_name }}" == "release/integrationnet" ]]; then
            VERSION=$(npx commit-and-tag-version --dry-run --prerelease rc | grep -oP 'tagging release v\K(.*)')
          fi
          [ -n "$VERSION" ] || { echo "ERROR: Failed to extract version from commit-and-tag-version"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Changelog
        id: get_changelog
        run: |
          if [[ "${{ github.ref_name }}" == "release/mainnet" ]]; then
            DRY_RUN=$(npx commit-and-tag-version --dry-run)
          elif [[ "${{ github.ref_name }}" == "release/integrationnet" ]]; then
            DRY_RUN=$(npx commit-and-tag-version --dry-run --prerelease rc)
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$DRY_RUN" | sed -n '/---/,/---/p' | sed '1d;$d'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set Git config
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Create release tag
        id: create_tag
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          echo "Release-As: $VERSION" >> $GITHUB_STEP_SUMMARY
          git tag -a v$VERSION -m "Release $VERSION"
          git push origin v$VERSION
          echo "release_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assembly 🚀
        run: sbt 'keytool/assembly;wallet/assembly;dagL0/assembly;dagL1/assembly'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.get_version.outputs.VERSION }}

      - name: Copy dependencies
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          cp ./modules/keytool/target/scala-2.13/tessellation-keytool-assembly-$VERSION.jar ./cl-keytool.jar
          cp ./modules/wallet/target/scala-2.13/tessellation-wallet-assembly-$VERSION.jar ./cl-wallet.jar
          cp ./modules/dag-l0/target/scala-2.13/tessellation-dag-l0-assembly-$VERSION.jar ./cl-node.jar
          cp ./modules/dag-l1/target/scala-2.13/tessellation-dag-l1-assembly-$VERSION.jar ./cl-dag-l1.jar

      - name: Create SHA-256 signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 007
          mkdir ./ramdisk 
          sudo mount -t tmpfs -o size=1M tmpfs ./ramdisk
          export KEY_NAME="$(uuidgen)"
          touch ./ramdisk/$KEY_NAME
          chmod 600 ./ramdisk/$KEY_NAME
          echo "$RELEASE_SIGNING_KEY" >  ./ramdisk/$KEY_NAME        
          for jar in cl-keytool cl-wallet cl-node cl-dag-l1; do
            echo "$(sha256sum ./$jar.jar | sed 's/ .*//')" > ./$jar.sha256
            openssl dgst -sha256 -sign ./ramdisk/$KEY_NAME -out /dev/stdout ./$jar.sha256 | base64 > ./$jar.sig
          done

      - name: Cleanup ramdisk
        if: always()
        run: |
          sudo umount ./ramdisk
          rm -rf ./ramdisk 

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          draft: true
          prerelease: false
          body: ${{ steps.get_changelog.outputs.CHANGELOG }}
          files: |
            ./cl-keytool.jar
            ./cl-keytool.sha256
            ./cl-keytool.sig
            ./cl-wallet.jar
            ./cl-wallet.sha256
            ./cl-node.jar
            ./cl-node.sha256
            ./cl-dag-l1.jar
            ./cl-dag-l1.sha256
            ./mainnet/mainnet-seedlist

      - name: Trigger SDK publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.get_version.outputs.VERSION }}
        run: |
          # GITHUB_TOKEN events are suppressed for most triggers, but
          # repository_dispatch is explicitly exempted from this restriction.
          # https://github.blog/changelog/2022-09-08-github-actions-use-github_token-with-workflow_dispatch-and-repository_dispatch/
          HTTP_CODE=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "{\"event_type\":\"publish-sdk\",\"client_payload\":{\"tag\":\"$TAG\"}}")
          if [ "$HTTP_CODE" -ne 204 ]; then
            echo "ERROR: SDK publish dispatch returned HTTP $HTTP_CODE (expected 204)"
            exit 1
          fi
          echo "Dispatched publish-sdk for $TAG"

