name: Nightly Deploy

on:
  # Deploy on every merge to develop so the nightly cluster always runs the latest code.
  # cancel-in-progress ensures rapid pushes don't pile up — only the latest deploy runs.
  push:
    branches:
      - develop
      - release/testnet
      - nightly_deploy_fixes
  workflow_dispatch:
    inputs:
      branch:
        type: string
        description: 'Branch to build and deploy'
        required: false
        default: 'release/testnet'
      skip_build:
        type: boolean
        description: 'Skip build (reuse existing JARs on nodes)'
        required: false
        default: false
      clean:
        type: boolean
        description: 'Wipe data and do fresh genesis (vs rollback restart)'
        required: false
        default: false
  workflow_call:
    inputs:
      branch:
        type: string
        required: false
        default: 'release/testnet'
      skip_build:
        type: boolean
        required: false
        default: false
      clean:
        type: boolean
        required: false
        default: false

# Shared with nightly-rebuild.yml — only one deploy/rebuild can run at a time
concurrency:
  group: nightly-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build JARs
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'release/testnet' }}
          fetch-tags: true

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache SBT dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Install sbt
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo gpg --dearmor -o /usr/share/keyrings/sbt-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/sbt-archive-keyring.gpg] https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          sudo apt-get update
          sudo apt-get install -y sbt

      # The build checkout above pins to release/testnet (the deploy branch), but
      # snapshot-streaming.patch fixes typically land on develop or a feature branch
      # first. Grab the patch file from the triggering ref so feature branches can
      # exercise fixes in CI before merging to release/testnet.
      - name: Grab snapshot-streaming patch from triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: .patch-source
          sparse-checkout: |
            docker/snapshot-streaming/snapshot-streaming.patch
          sparse-checkout-cone-mode: false

      # snapshot-streaming.patch removes c.forkInfoStorage from Configuration.scala
      # to match release/testnet's SharedConfigReader. Other branches still have
      # forkInfoStorage, so applying the patch there would drop a required arg
      # and break the build. Overlay the triggering ref's patch only when the
      # build ref is release/testnet; otherwise clear the patch file.
      - name: Apply or disable snapshot-streaming patch
        run: |
          src=.patch-source/docker/snapshot-streaming/snapshot-streaming.patch
          dst=docker/snapshot-streaming/snapshot-streaming.patch
          if [ "${{ inputs.branch || 'release/testnet' }}" = "release/testnet" ]; then
            if [ -f "$src" ] && [ -s "$src" ]; then
              cp "$src" "$dst"
              echo "Overlaid snapshot-streaming.patch from ${{ github.ref_name }} ($(wc -c < "$dst") bytes)"
            else
              echo "No snapshot-streaming.patch on triggering ref (${{ github.ref_name }}) — leaving build-ref copy in place"
            fi
          else
            : > "$dst"
            echo "Cleared snapshot-streaming.patch (building ${{ inputs.branch }}, not release/testnet)"
          fi

      - name: Build all JARs
        run: just build --num-gl0=3 --snapshot-streaming-branch=${{ vars.SNAPSHOT_STREAMING_BRANCH || 'testing' }} --block-explorer-branch=${{ vars.BLOCK_EXPLORER_BRANCH || 'increase_delegated_stakes' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_STREAMING_REPO: https://github.com/Constellation-Labs/snapshot-streaming.git

      - name: Upload tessellation JARs
        uses: actions/upload-artifact@v4
        with:
          name: tessellation-jars
          path: docker/jars/
          retention-days: 3

      - name: Upload snapshot-streaming JAR
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-streaming-jar
          path: docker/snapshot-streaming/snapshot-streaming.jar
          retention-days: 3

      - name: Upload block-explorer prisma
        uses: actions/upload-artifact@v4
        with:
          name: block-explorer-prisma
          path: docker/snapshot-streaming/block-explorer/prisma/
          retention-days: 3

  deploy:
    name: Deploy to nightly cluster
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # Deploy uses tooling from the triggering ref (monitoring scripts, compose
      # files, action_scripts) — these may not exist on older release branches.
      # JARs come from the build job's artifacts, built from inputs.branch.
      - name: Checkout deploy tooling
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Download tessellation JARs
        if: ${{ !inputs.skip_build }}
        uses: actions/download-artifact@v4
        with:
          name: tessellation-jars
          path: docker/jars/

      - name: Download snapshot-streaming JAR
        if: ${{ !inputs.skip_build }}
        uses: actions/download-artifact@v4
        with:
          name: snapshot-streaming-jar
          path: docker/snapshot-streaming/

      - name: Download block-explorer prisma
        if: ${{ !inputs.skip_build }}
        uses: actions/download-artifact@v4
        with:
          name: block-explorer-prisma
          path: docker/snapshot-streaming/block-explorer/prisma/

      - name: Validate configuration
        run: |
          if [ -z "${{ vars.NIGHTLY_HOSTS }}" ]; then
            echo "::error::NIGHTLY_HOSTS repository variable is not configured"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NIGHTLY_SSH_KEY }}" > ~/.ssh/nightly_key
          chmod 600 ~/.ssh/nightly_key
          touch ~/.ssh/config

          IFS=',' read -ra IPS <<< "${{ vars.NIGHTLY_HOSTS }}"
          for i in "${!IPS[@]}"; do
            cat >> ~/.ssh/config <<EOF
          Host n$i
              User root
              Hostname ${IPS[$i]}
              IdentityFile ~/.ssh/nightly_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
          EOF
          done
          chmod 600 ~/.ssh/config

      - name: Verify SSH connectivity
        run: |
          IFS=',' read -ra IPS <<< "${{ vars.NIGHTLY_HOSTS }}"
          for i in "${!IPS[@]}"; do
            echo "Testing n$i (${IPS[$i]})..."
            ssh -o ConnectTimeout=10 "n$i" "hostname"
          done

      - name: Stop existing cluster
        run: |
          IFS=',' read -ra IPS <<< "${{ vars.NIGHTLY_HOSTS }}"
          NODES=$(printf "n%s," "${!IPS[@]}" | sed 's/,$//')
          CLEAN="${{ inputs.clean }}"
          CLEAN="${CLEAN:-false}"
          if [ "$CLEAN" = "true" ]; then
            just down --remote="$NODES" --clean
          else
            just down --remote="$NODES"
          fi

      - name: Deploy monitoring
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.NIGHTLY_GRAFANA_PASSWORD }}
          CLICKHOUSE_PASSWORD: ${{ secrets.NIGHTLY_CLICKHOUSE_PASSWORD }}
        run: |
          IFS=',' read -ra IPS <<< "${{ vars.NIGHTLY_HOSTS }}"
          NODES=$(printf "n%s," "${!IPS[@]}" | sed 's/,$//')
          export REMOTE_NODES="$NODES"
          bash docker/monitoring/deploy-monitoring.sh

      - name: Deploy cluster
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLICKHOUSE_HOST: ${{ secrets.NIGHTLY_CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.NIGHTLY_CLICKHOUSE_PORT || '8123' }}
          CLICKHOUSE_PROTOCOL: ${{ secrets.NIGHTLY_CLICKHOUSE_PROTOCOL || 'http' }}
          CLICKHOUSE_USER: ${{ secrets.NIGHTLY_CLICKHOUSE_USER || 'default' }}
          CLICKHOUSE_PASSWORD: ${{ secrets.NIGHTLY_CLICKHOUSE_PASSWORD || 'clickhouse' }}
          CLICKHOUSE_DATABASE: ${{ secrets.NIGHTLY_CLICKHOUSE_DATABASE || 'default' }}
        run: |
          IFS=',' read -ra IPS <<< "${{ vars.NIGHTLY_HOSTS }}"
          # Monitoring ClickHouse runs on the last NIGHTLY_HOSTS node; default to
          # its IP when the explicit secret isn't set.
          if [ -z "$CLICKHOUSE_HOST" ]; then
            export CLICKHOUSE_HOST="${IPS[-1]}"
          fi
          NODES=$(printf "n%s," "${!IPS[@]}" | sed 's/,$//')
          just up --skip-assembly --remote="$NODES" --snapshot-streaming-branch=${{ vars.SNAPSHOT_STREAMING_BRANCH || 'testing' }} --block-explorer-branch=${{ vars.BLOCK_EXPLORER_BRANCH || 'increase_delegated_stakes' }}

      - name: Verify monitoring pipeline
        env:
          CH_PASS: ${{ secrets.NIGHTLY_CLICKHOUSE_PASSWORD || 'clickhouse' }}
        run: |
          IFS=',' read -ra IPS <<< "${{ vars.NIGHTLY_HOSTS }}"
          LAST=$((${#IPS[@]} - 1))

          # Prometheus/Grafana listen on host networking on the monitoring node, not
          # exposed publicly — probe via SSH from inside the node.
          echo "=== Prometheus ==="
          ssh "n$LAST" "curl -fsS http://localhost:9090/-/ready"

          echo "=== Grafana ==="
          ssh "n$LAST" "curl -fsS http://localhost:3000/api/health" | python3 -c "
          import sys,json
          h=json.load(sys.stdin)
          assert h.get('database') == 'ok', f'Grafana unhealthy: {h}'
          print(f'  version: {h.get(\"version\")}')
          "

          echo "=== ClickHouse log ingestion ==="
          # Nodes log asynchronously; allow up to 2 min for the first batch to land.
          for i in $(seq 1 12); do
            rows=$(ssh "n$LAST" "docker exec clickhouse clickhouse-client --password '$CH_PASS' -q \"SELECT count() FROM default.nightly_logs WHERE timestamp > now() - INTERVAL 2 MINUTE\"" 2>/dev/null || echo 0)
            if [ "${rows:-0}" -gt 0 ] 2>/dev/null; then
              echo "  OK: $rows rows in last 2min"
              exit 0
            fi
            printf "  Waiting for log rows... (%d/12)\n" "$i"
            sleep 10
          done

          echo "::error::No rows ingested into nightly_logs within 2 minutes"
          echo "=== Diagnostics ==="
          echo "--- n0 /opt/tessellation/.env CLICKHOUSE_* lines ---"
          ssh n0 "grep ^CLICKHOUSE_ /opt/tessellation/.env 2>&1 || echo '(no .env or no CLICKHOUSE_ lines)'"
          echo "--- ClickHouse server reachable from n0? ---"
          ssh n0 "curl -sS -o /dev/null -w 'http_code=%{http_code}\n' --max-time 5 http://\$(grep ^CLICKHOUSE_HOST= /opt/tessellation/.env | cut -d= -f2):8123/ping || true"
          echo "--- Total rows in nightly_logs (all time) ---"
          ssh "n$LAST" "docker exec clickhouse clickhouse-client --password '$CH_PASS' -q 'SELECT count() FROM default.nightly_logs'" || true
          echo "--- gl0 recent log tail on n0 ---"
          ssh n0 "docker logs gl0 2>&1 | tail -30" || true
          exit 1

      - name: Post-deploy health check
        run: |
          GENESIS_IP=$(echo "${{ vars.NIGHTLY_HOSTS }}" | cut -d',' -f1)

          echo "=== GL0 Cluster ==="
          curl -sf "http://$GENESIS_IP:9000/cluster/info" | python3 -c "
          import sys,json
          peers=json.load(sys.stdin)
          for p in peers: print(f\"  {p['state']:12} {p['ip']}:{p['publicPort']}\")
          assert len(peers) >= 3, f'Expected 3+ GL0 nodes, got {len(peers)}'
          "

          echo "=== GL1 Cluster ==="
          curl -sf "http://$GENESIS_IP:9010/cluster/info" | python3 -c "
          import sys,json
          peers=json.load(sys.stdin)
          for p in peers: print(f\"  {p['state']:12} {p['ip']}:{p['publicPort']}\")
          assert len(peers) >= 3, f'Expected 3+ GL1 nodes, got {len(peers)}'
          "

          echo "=== Snapshots ==="
          curl -sf "http://$GENESIS_IP:9000/global-snapshots/latest" | python3 -c "
          import sys,json
          ordinal=json.load(sys.stdin)['value']['ordinal']
          print(f'Latest ordinal: {ordinal}')
          assert ordinal > 0, 'No snapshots produced'
          "

      - name: Collect remote logs on failure
        if: failure()
        run: |
          mkdir -p runner-logs
          IFS=',' read -ra IPS <<< "${{ vars.NIGHTLY_HOSTS }}"
          for i in "${!IPS[@]}"; do
            echo "=== n$i (${IPS[$i]}) ===" >> runner-logs/remote-status.txt
            ssh "n$i" "docker ps -a 2>/dev/null" >> runner-logs/remote-status.txt 2>&1 || true
            for svc in gl0 gl1; do
              ssh "n$i" "docker logs $svc 2>&1 | tail -50" > "runner-logs/n${i}-${svc}.log" 2>&1 || true
            done
          done

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-deploy-logs-${{ github.run_number }}
          path: runner-logs/
          retention-days: 7

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success' && ':large_green_circle: Nightly Deploy succeeded' || ':red_circle: Nightly Deploy failed' }} (${{ github.ref_name }})",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ job.status == 'success' && ':large_green_circle: *Nightly Deploy succeeded*' || ':red_circle: *Nightly Deploy failed*' }}\nBranch: `${{ github.ref_name }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run #${{ github.run_number }}>"
                  }
                }
              ]
            }
