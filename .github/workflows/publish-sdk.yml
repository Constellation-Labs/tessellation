on:
  # Triggered by release.yml after creating a tag (via repository_dispatch)
  # GITHUB_TOKEN can trigger repository_dispatch without needing a PAT
  # https://github.blog/changelog/2022-09-08-github-actions-use-github_token-with-workflow_dispatch-and-repository_dispatch/
  repository_dispatch:
    types: [publish-sdk]

  # Also supports direct tag push triggers (e.g., manual tag push with a PAT)
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"       # stable: v4.1.0
      - "v[0-9]+.[0-9]+.[0-9]+-rc.*"  # release candidates: v4.1.0-rc.1

name: Publish SDK

permissions:
  contents: read

jobs:
  publish:
    name: Publish SDK to Sonatype Central
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve tag ref
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          else
            TAG="${{ github.ref }}"
            TAG="${TAG#refs/tags/}"
          fi
          [ -n "$TAG" ] || { echo "ERROR: No tag resolved"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing SDK for tag: $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Setup Java and scala
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          JAVA_VERSION: 21
        uses: "./.github/templates/actions/setup_java_and_scala"

      - name: Publish SDK module to Sonatype Central
        run: |
          # ci-release checks GITHUB_REF to detect tag context.
          # For repository_dispatch, GITHUB_REF points to the default branch,
          # so we override it in the shell environment for the sbt child process.
          export GITHUB_REF="refs/tags/$TAG"
          sbt ci-release
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          # Priority-1 version override in build.sbt: pins the version for the whole
          # sbt session so a dirtied working tree cannot shift the sonatype staging
          # path between publishSigned and the release step
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          # Use sonatypeCentralRelease (sbt-sonatype) instead of sonaRelease (sbt 1.11.0+)
          # Required because project is on sbt 1.9.8
          CI_SONATYPE_RELEASE: sonatypeCentralRelease
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.MVN_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.MVN_USERNAME }}

      - name: Fail if the build mutated the workspace
        run: git diff --exit-code
